<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VoLum — PLAY surface prototype (opus round 2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poiret+One&family=Josefin+Sans:wght@300;400;600;700&family=Michroma&display=swap" rel="stylesheet">
<style>
/* Local product fonts win over the CDN copies when the file:// read succeeds. */
@font-face{font-family:'Poiret One';src:url('../../../../NeuralAmpModeler/resources/fonts/PoiretOne-Regular.ttf') format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:'Josefin Sans';src:url('../../../../NeuralAmpModeler/resources/fonts/JosefinSans-Regular.ttf') format('truetype');font-weight:400;font-display:swap}
@font-face{font-family:'Josefin Sans';src:url('../../../../NeuralAmpModeler/resources/fonts/JosefinSans-SemiBold.ttf') format('truetype');font-weight:600;font-display:swap}
@font-face{font-family:'Josefin Sans';src:url('../../../../NeuralAmpModeler/resources/fonts-win/JosefinSans-Bold.ttf') format('truetype');font-weight:700;font-display:swap}
@font-face{font-family:'Michroma';src:url('../../../../NeuralAmpModeler/resources/fonts/Michroma-Regular.ttf') format('truetype');font-weight:400;font-display:swap}

:root{
  --ink:#111118; --void:#080a0e;
  --gold:#fcde91; --gold-deep:#e2bd68; --brass:#b8914a;
  --teal:#5bc4c4; --teal-dim:rgba(91,196,196,.42);
  --cream:#e9e3d3; --cream-dim:rgba(233,227,211,.56);
  --in:.35; --in2:.30; --peak:.5; --peak2:.45;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:radial-gradient(1100px 620px at 50% -10%, #1a2230 0%, #0c0e14 55%, #06070a 100%);
  font-family:'Josefin Sans',sans-serif;color:var(--cream);
  display:flex;flex-direction:column;align-items:center;overflow:hidden;-webkit-font-smoothing:antialiased;
}

/* ════════════════ outside-the-frame lab chrome ════════════════ */
.lab-top{width:900px;display:flex;align-items:center;justify-content:space-between;margin:10px 0 7px}
.lab-tag{font-family:'Michroma';font-size:8.5px;letter-spacing:.32em;color:rgba(233,227,211,.30);text-transform:uppercase}
.lab-tag b{color:rgba(252,222,145,.6);font-weight:400}
.lbtn{
  font-family:'Michroma';font-size:8px;letter-spacing:.2em;text-transform:uppercase;
  background:rgba(255,255,255,.03);color:rgba(233,227,211,.45);
  border:1px solid rgba(255,255,255,.09);border-radius:2px;padding:7px 12px;cursor:pointer;transition:all .16s ease;
}
.lbtn:hover{color:var(--cream);border-color:rgba(252,222,145,.4)}
.lbtn.on{background:linear-gradient(180deg,#f2d99e,#c8a45e);border-color:#f2d99e;color:#141118}
.lbtn.step.done{border-color:rgba(91,196,196,.5);color:rgba(91,196,196,.9)}
.scenes{display:flex;gap:6px}

.lab-bar{
  position:fixed;left:50%;bottom:8px;transform:translateX(-50%);width:1010px;
  display:flex;flex-direction:column;gap:7px;padding:9px 13px;border-radius:3px;
  background:rgba(10,12,17,.92);border:1px solid rgba(252,222,145,.16);box-shadow:0 10px 40px rgba(0,0,0,.6);
}
.lab-row{display:flex;align-items:center;gap:10px}
.lab-bar .arrow{width:28px;padding:7px 0;text-align:center;font-size:12px;font-family:'Josefin Sans'}
.lab-bar .vlabel{min-width:214px;text-align:center;line-height:1.25}
.lab-bar .vlabel .k{font-family:'Michroma';font-size:9px;letter-spacing:.22em;color:var(--gold)}
.lab-bar .vlabel .d{font-size:10.5px;letter-spacing:.05em;color:rgba(233,227,211,.42)}
.lab-bar .sep{width:1px;height:26px;background:rgba(255,255,255,.09)}
.walklab{font-family:'Michroma';font-size:7.5px;letter-spacing:.26em;color:rgba(91,196,196,.7);white-space:nowrap}
.stateline{
  display:flex;align-items:center;gap:0;flex-wrap:wrap;
  font-family:'Michroma';font-size:8px;letter-spacing:.16em;color:rgba(233,227,211,.4);
  border-top:1px solid rgba(255,255,255,.07);padding-top:7px;
}
.stateline .sk{color:rgba(91,196,196,.6);margin-right:6px}
.stateline .sv{color:var(--cream);margin-right:18px}
.stateline .sv.hot{color:var(--gold)}
.stateline .sv.cold{color:rgba(233,227,211,.35)}

/* ════════════════ 900×600 plugin chrome ════════════════ */
#frame{
  position:relative;width:900px;height:600px;flex:0 0 auto;
  background:linear-gradient(180deg,#141a24 0%,#0d1017 46%,#0a0c11 100%);
  border:1px solid rgba(252,222,145,.20);
  box-shadow:0 0 0 1px rgba(0,0,0,.9),0 24px 64px rgba(0,0,0,.72),inset 0 0 90px rgba(0,0,0,.55);
  overflow:hidden;user-select:none;
}
#frame::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:30;
  background:radial-gradient(120% 90% at 50% 0%,rgba(91,196,196,.05),transparent 60%),
             radial-gradient(120% 120% at 50% 110%,rgba(0,0,0,.5),transparent 62%)}

.hdr{position:relative;z-index:16;height:46px;display:flex;align-items:center;padding:0 14px 0 16px;gap:14px;
  border-bottom:1px solid rgba(91,196,196,.10);background:linear-gradient(180deg,rgba(16,22,31,.96),rgba(12,16,23,.72))}
.brand{display:flex;flex-direction:column;line-height:1;width:148px}
.brand .wm{font-family:'Poiret One';font-size:25px;color:var(--gold)}
.brand .sub{font-family:'Michroma';font-size:6.5px;letter-spacing:.42em;color:rgba(252,222,145,.5);margin:3px 0 0 2px}
.hdr-mid{flex:1;display:flex;justify-content:center}
.midi-pill{display:flex;align-items:center;gap:8px;padding:4px 12px;border-radius:2px;
  border:1px solid rgba(91,196,196,.20);background:rgba(91,196,196,.05)}
.midi-pill .dot{width:5px;height:5px;border-radius:50%;background:var(--teal);box-shadow:0 0 7px var(--teal)}
.midi-pill span{font-family:'Michroma';font-size:7px;letter-spacing:.24em;color:rgba(233,227,211,.5)}
.midi-pill b{font-family:'Michroma';font-size:7px;letter-spacing:.24em;color:var(--gold);font-weight:400}
.hdr-right{display:flex;align-items:center;gap:11px}
.pb{display:flex;border:1px solid rgba(252,222,145,.30);border-radius:2px;overflow:hidden;background:rgba(0,0,0,.3)}
.pb button{font-family:'Michroma';font-size:8.5px;letter-spacing:.2em;padding:6px 13px;background:transparent;border:0;
  color:rgba(233,227,211,.42);cursor:pointer;transition:.16s}
.pb button.on{background:linear-gradient(180deg,#f3daa0,#c6a25c);color:#15121a}
.pb button:not(.on):hover{color:var(--cream);background:rgba(252,222,145,.07)}
.hdr-sep{width:1px;height:20px;background:rgba(91,196,196,.18)}
.icobtn{background:none;border:0;cursor:pointer;padding:2px;line-height:0;position:relative;opacity:.82;transition:.16s}
.icobtn:hover{opacity:1;transform:translateY(-1px)}
.icobtn .badge{position:absolute;top:-1px;right:-2px;width:6px;height:6px;border-radius:50%;background:var(--gold);
  box-shadow:0 0 6px rgba(252,222,145,.9)}

/* Art Deco corner ticks */
.deco{position:relative}
.deco > i.ct{position:absolute;width:9px;height:9px;pointer-events:none;z-index:8}
.deco > i.tl{top:3px;left:3px;border-left:1px solid var(--teal-dim);border-top:1px solid var(--teal-dim)}
.deco > i.tr{top:3px;right:3px;border-right:1px solid var(--teal-dim);border-top:1px solid var(--teal-dim)}
.deco > i.bl{bottom:3px;left:3px;border-left:1px solid var(--teal-dim);border-bottom:1px solid var(--teal-dim)}
.deco > i.br{bottom:3px;right:3px;border-right:1px solid var(--teal-dim);border-bottom:1px solid var(--teal-dim)}
.deco.gold > i.ct{border-color:rgba(252,222,145,.75)}

/* ════════════════ meters ════════════════ */
.mstack{display:flex;flex-direction:column;align-items:center;gap:5px}
.mstack.h{flex-direction:row;align-items:center;gap:6px}
.mrow{display:flex;gap:5px;align-items:flex-end}
.mcell{display:flex;flex-direction:column;align-items:center;gap:3px}
.mcell .ch{font-family:'Michroma';font-size:6px;letter-spacing:.1em;color:rgba(233,227,211,.42)}
.track{position:relative;width:8px;border-radius:1px;overflow:hidden;
  background:linear-gradient(180deg,#0a0d12,#05070a);border:1px solid rgba(91,196,196,.20)}
.track .fill{position:absolute;left:0;right:0;bottom:0;height:calc(var(--in) * 100%);
  background:linear-gradient(0deg,#c8a45e 0%,#fcde91 55%,#fff2cf 100%)}
.track .fill::after{content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,0) 0 2px,rgba(4,6,9,.85) 2px 3px)}
.track .pk{position:absolute;left:0;right:0;height:2px;bottom:calc(var(--peak) * 100%);background:#fff6dd;
  box-shadow:0 0 6px rgba(252,222,145,.8)}
.track.r .fill{height:calc(var(--in2) * 100%)}
.track.r .pk{bottom:calc(var(--peak2) * 100%)}
.mstack.out .track .fill{background:linear-gradient(0deg,#3f9d9d 0%,#5bc4c4 60%,#c9f2f2 100%)}
.mstack.out .track .pk{background:#d6ffff}
.mlab{font-family:'Josefin Sans';font-size:8.5px;color:rgba(233,227,211,.45);
  writing-mode:vertical-rl;text-orientation:upright;line-height:1.1;letter-spacing:.02em}

/* ════════════════ amp art — planted, lit by --in ════════════════ */
.artswap{position:absolute;inset:0}
.artlive{position:absolute;inset:0;will-change:filter}
.artlive img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  transform:scale(var(--z,1));transform-origin:50% var(--oy,50%);display:block;
  filter:brightness(calc(.46 + var(--in)*1.06)) saturate(calc(.78 + var(--in)*.34))}
.artlive.lag img{filter:brightness(calc(.46 + var(--in2)*.96)) saturate(calc(.78 + var(--in2)*.30))}
/* the house-lights scrim: quiet playing sits the cabinet back in the dark */
.artlive::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:1;
  background:rgba(4,6,11,calc(.50 - var(--in)*.50))}
.artlive.lag::before{background:rgba(4,6,11,calc(.50 - var(--in2)*.50))}
.artlive::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:2;
  background:radial-gradient(ellipse at 50% 38%,rgba(252,222,145,calc(var(--in)*.56)),transparent 70%);
  mix-blend-mode:soft-light}
.artlive.lag::after{
  background:radial-gradient(ellipse at 50% 38%,rgba(91,196,196,calc(var(--in2)*.48)),transparent 70%)}
.recall .artswap{animation:swapin 240ms cubic-bezier(.2,.7,.3,1) both}
@keyframes swapin{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:translateX(0)}}
.recall .rname{animation:rname 260ms cubic-bezier(.2,.7,.3,1) both}
@keyframes rname{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.ampcard{position:relative;overflow:hidden;background:#080b10;border:1px solid rgba(252,222,145,.34);
  box-shadow:0 0 0 1px rgba(252,222,145,calc(var(--in)*.55)),
             0 0 calc(4px + var(--in)*72px) rgba(252,222,145,calc(var(--in)*.42)),
             inset 0 0 46px rgba(0,0,0,.75)}
.ampcard.support{border-color:rgba(91,196,196,.42);
  box-shadow:0 0 0 1px rgba(91,196,196,calc(var(--in2)*.55)),
             0 0 calc(4px + var(--in2)*64px) rgba(91,196,196,calc(var(--in2)*.36)),
             inset 0 0 46px rgba(0,0,0,.75)}
.ampcard .vig{position:absolute;inset:0;pointer-events:none;z-index:3;
  background:radial-gradient(122% 98% at 50% 44%,transparent 50%,rgba(6,8,12,calc(.94 - var(--in)*.50)) 100%)}
.ampcard.support .vig{
  background:radial-gradient(122% 98% at 50% 44%,transparent 50%,rgba(6,8,12,calc(.94 - var(--in2)*.50)) 100%)}
.amptag{position:absolute;top:6px;left:9px;z-index:6;font-family:'Michroma';font-size:6.5px;letter-spacing:.30em;
  color:rgba(252,222,145,.92)}
.amptag.t{color:rgba(91,196,196,.92)}
.ampname{position:absolute;left:0;right:0;bottom:0;z-index:6;text-align:center;padding:5px 6px 6px;
  font-family:'Josefin Sans';font-weight:600;font-size:10.5px;letter-spacing:.12em;color:rgba(233,227,211,.82);
  background:linear-gradient(180deg,transparent,rgba(5,7,11,.92) 55%)}
.horizon{position:absolute;left:0;right:0;bottom:0;height:2px;transform-origin:left center;
  transform:scaleX(var(--in));z-index:7;
  background:linear-gradient(90deg,rgba(252,222,145,.95),rgba(91,196,196,.5));box-shadow:0 0 12px rgba(252,222,145,.5)}
.horizon.lag{transform:scaleX(var(--in2));background:linear-gradient(90deg,rgba(91,196,196,.9),rgba(252,222,145,.4))}

.eyebrow{font-family:'Michroma';font-size:7px;letter-spacing:.32em;color:rgba(91,196,196,.72);text-transform:uppercase}
.eyebrow.g{color:rgba(252,222,145,.62)}
.hint{border:1px solid rgba(91,196,196,.20);background:rgba(9,14,20,.6);border-radius:2px;text-align:center;
  padding:4px 0;font-size:10.5px;letter-spacing:.09em;color:rgba(233,227,211,.42)}
.hint b{color:rgba(252,222,145,.78);font-weight:400;letter-spacing:.13em}
.dualbadge{display:inline-flex;align-items:center;gap:5px;padding:2px 7px;border:1px solid rgba(91,196,196,.5);
  border-radius:2px;font-family:'Michroma';font-size:6px;letter-spacing:.22em;color:rgba(91,196,196,.95);
  background:rgba(91,196,196,.08);pointer-events:none;cursor:default}
.unsavedbadge{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border:1px solid rgba(252,222,145,.5);
  border-radius:2px;background:rgba(252,222,145,.08);font-size:9.5px;letter-spacing:.18em;
  color:var(--gold);text-transform:uppercase}
.unsavedbadge i{width:4px;height:4px;border-radius:50%;background:var(--gold);box-shadow:0 0 7px var(--gold)}
.unsavedbadge.sm{font-size:8px;padding:2px 6px;letter-spacing:.2em}

@keyframes justpop{0%{transform:scale(1)}35%{transform:scale(1.07)}100%{transform:scale(1)}}
@keyframes shake{10%,90%{transform:translateX(-1px)}20%,80%{transform:translateX(2px)}30%,50%,70%{transform:translateX(-3px)}40%,60%{transform:translateX(3px)}}
.shake{animation:shake .42s cubic-bezier(.36,.07,.19,.97) both}
.deadtip{position:absolute;z-index:24;top:-20px;left:50%;transform:translateX(-50%);white-space:nowrap;
  font-family:'Michroma';font-size:6px;letter-spacing:.2em;color:#e79b9b;background:rgba(30,10,12,.96);
  border:1px solid rgba(214,120,120,.5);padding:3px 7px}

/* ════════════════ THE BOTTOM BOARD (all six variants) ════════════════ */
.boardband{display:flex;align-items:stretch;gap:9px}
.bmeter{display:flex;align-items:center;justify-content:center}
.bplate{position:relative;flex:1;display:flex;flex-direction:column;padding:7px 11px 9px;
  background:linear-gradient(180deg,rgba(28,35,46,.62),rgba(11,14,20,.82)),
             repeating-linear-gradient(90deg,rgba(255,255,255,.016) 0 1px,transparent 1px 4px);
  border:1px solid rgba(91,196,196,.18);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),inset 0 -18px 32px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.5)}
.bhead{display:flex;align-items:center;margin-bottom:6px}
.bhead .half{flex:1;display:flex;align-items:center;gap:9px;min-width:0}
.bhead .halfgap{flex:0 0 11px}
.bhead .glab{font-family:'Michroma';font-size:6.5px;letter-spacing:.30em;color:rgba(91,196,196,.78);white-space:nowrap}
.bhead .glab.g{color:rgba(252,222,145,.72)}
.bhead .grule{flex:1;height:1px;background:linear-gradient(90deg,rgba(91,196,196,.24),transparent)}
.bcells{flex:1;display:flex;gap:7px;min-height:0}
.bcells > *{flex:1;min-width:0}
.bdiv{flex:0 0 1px !important;background:linear-gradient(180deg,transparent,rgba(91,196,196,.55),transparent);margin:0 5px}

/* board style 1 — art stomp cards (A, E) */
.stompcard{position:relative;display:flex;flex-direction:column;cursor:pointer;overflow:hidden;
  background:linear-gradient(180deg,#111a25,#070a0f);border:1px solid rgba(91,196,196,.22);
  box-shadow:0 4px 10px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.05);
  transition:border-color .16s,box-shadow .16s,transform .16s}
.stompcard .pimg{flex:1;position:relative;overflow:hidden;background:#070a0e;min-height:0}
.stompcard .pimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.30;transition:opacity .18s;
  transform:scale(var(--z,1));transform-origin:50% var(--oy,50%)}
.stompcard .pimg .sprite{position:absolute;inset:0;background-repeat:no-repeat;opacity:.30;transition:opacity .18s}
.stompcard .plab{height:20px;display:flex;align-items:center;justify-content:center;
  border-top:1px solid rgba(91,196,196,.16);background:rgba(5,7,10,.88)}
.stompcard .plab span{font-family:'Josefin Sans';font-weight:600;font-size:8.5px;letter-spacing:.14em;
  color:rgba(233,227,211,.40);transition:.18s}
.stompcard .led{position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:#232c37;
  box-shadow:inset 0 0 3px #000;z-index:5;transition:.18s}
.stompcard:hover{transform:translateY(-1px);border-color:rgba(91,196,196,.45)}
.stompcard:active{transform:translateY(1px)}
.stompcard.on{border-color:rgba(252,222,145,.62);
  box-shadow:0 4px 14px rgba(0,0,0,.6),0 0 18px rgba(252,222,145,.13),inset 0 1px 0 rgba(252,222,145,.14)}
.stompcard.on .pimg img,.stompcard.on .pimg .sprite{opacity:.95}
.stompcard.on .plab{background:linear-gradient(180deg,rgba(56,42,18,.82),rgba(20,15,9,.95))}
.stompcard.on .plab span{color:var(--gold)}
.stompcard.on .led{background:var(--gold);box-shadow:0 0 9px rgba(252,222,145,.95),0 0 2px #fff}
.stompcard.na{opacity:.30;cursor:not-allowed;border-style:dashed}
.stompcard.na:hover{transform:none}
.stompcard.just{animation:justpop 380ms ease-out}

/* board style 2 — jewels (B) */
.jewel{position:relative;cursor:pointer;text-align:center;transition:transform .18s;
  display:flex;flex-direction:column;justify-content:center}
.jewel .gem{position:relative;height:38px;display:flex;align-items:center;justify-content:center;
  border:1px solid rgba(91,196,196,.22);background:linear-gradient(180deg,rgba(17,26,38,.92),rgba(7,10,15,.94));
  clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,12px 100%,0 50%);transition:.18s}
.jewel .gem i{width:8px;height:8px;background:#232c37;transform:rotate(45deg);box-shadow:inset 0 0 3px #000;transition:.18s}
.jewel .jt{display:block;margin-top:8px;font-family:'Michroma';font-size:6.5px;letter-spacing:.22em;
  color:rgba(233,227,211,.36);transition:.18s}
.jewel:hover{transform:translateY(-2px)}
.jewel.on .gem{border-color:rgba(252,222,145,.8);background:linear-gradient(180deg,rgba(70,52,21,.92),rgba(24,18,10,.95));
  box-shadow:0 0 20px rgba(252,222,145,.22)}
.jewel.on .gem i{background:var(--gold);box-shadow:0 0 10px rgba(252,222,145,.95),0 0 2px #fff}
.jewel.on .jt{color:var(--gold)}
.jewel.na{opacity:.28;cursor:not-allowed}
.jewel.just .gem{animation:justpop 380ms ease-out}

/* board style 3 — slim rail switches (C) */
.railsw{position:relative;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding-top:12px;border:1px solid rgba(91,196,196,.18);border-radius:2px;
  background:linear-gradient(180deg,rgba(20,28,39,.9),rgba(7,10,15,.94));transition:.16s}
.railsw .cap{width:25px;height:25px;border-radius:50%;margin:0 auto 8px;
  background:radial-gradient(circle at 36% 26%,#828b99,#3a414c 54%,#161b22);
  box-shadow:0 2px 4px rgba(0,0,0,.9),inset 0 0 0 2px rgba(17,21,28,.92),
             inset 0 -2px 3px rgba(0,0,0,.6),0 0 0 4px rgba(255,255,255,.035);transition:.18s}
.railsw .rt{font-family:'Josefin Sans';font-weight:600;font-size:8.5px;letter-spacing:.15em;
  color:rgba(233,227,211,.40);transition:.18s}
.railsw .led{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:6px;height:6px;border-radius:50%;
  background:#232c37;box-shadow:inset 0 0 3px #000;transition:.18s}
.railsw:hover{border-color:rgba(91,196,196,.45);transform:translateY(-1px)}
.railsw.on{border-color:rgba(252,222,145,.62);box-shadow:0 0 18px rgba(252,222,145,.12),inset 0 1px 0 rgba(252,222,145,.14)}
.railsw.on .cap{background:radial-gradient(circle at 36% 26%,#f6e6bb,#ac9052 54%,#382e1b);
  box-shadow:0 2px 4px rgba(0,0,0,.9),inset 0 0 0 2px rgba(44,35,17,.9),
             0 0 16px rgba(252,222,145,.42),0 0 0 4px rgba(252,222,145,.07)}
.railsw.on .rt{color:var(--gold)}

/* board style 5 — chassis pedals with footswitches (F) */
.chassis{background:linear-gradient(180deg,#2a323f 0%,#181e27 12%,#10141b 60%,#0a0d12 100%),

  border:1px solid rgba(150,165,185,.20);

.pedal .pimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.30;transition:opacity .18s;
  transform:scale(var(--z,1));transform-origin:50% var(--oy,50%)}
.pedal .pimg .sprite{position:absolute;inset:0;background-repeat:no-repeat;opacity:.30;transition:opacity .18s}

  A:{k:'A · STAGE DOWN',    d:'hero + type, art filmstrip, board at the bottom'},
  B:{k:'B · POSTER BOARD',  d:'98px program number, numbered spine, jewel board'},
  C:{k:'C · TWIN STAGE',    d:'two equal breathing heroes, thin ribbon, rail switches'},
  D:{k:'D · THUMB RAIL',    d:'huge centre art, PC thumbs on the right, board below'},
  E:{k:'E · FILM UNDER ART',d:'full-width art, sprocket filmstrip, board below'},
  F:{k:'F · OVERLAY RECALL',d:'edge-to-edge art, PC pills on the art, chassis board'},
};

/* ═════════════════════════ state ═════════════════════════ */
const qs = new URLSearchParams(location.search);
const state = {
  variant:(qs.get('variant')||'A').toUpperCase(),
  scene:(qs.get('scene')||'gig'),
  active:0,
  live:null,        /* the LIVE rig bypass state (what is sounding right now) */
  dirty:false,      /* stomped since recall → the named Sound is (unsaved) */
  recall:false,
  justFx:null,
  walk:0,
};
if(!VARIANTS[state.variant]) state.variant='A';

const freezeQ = qs.get('freeze');
const FREEZE = (freezeQ!==null && freezeQ!=='') ? parseFloat(freezeQ) : null;

function list(){
  return (state.variant==='D' && state.scene==='long') ? SOUNDS.concat(EXTRA) : SOUNDS;
}
function soundByPc(pc){ return list().findIndex(s=>s.pc===String(pc).padStart(2,'0')); }
function cur(){ const L=list(); return L[Math.min(state.active, L.length-1)] || L[0]; }
function isDual(){ return !!cur().dual; }

function recall(i, animate){
  const L = list();
  const s = L[i];
  if(!s || s.invalid) return false;          /* invalid slots do nothing */
  state.active = i;
  state.live = Object.assign({}, s.fx);      /* the Sound's snapshot comes back */
  state.dirty = false;
  state.justFx = null;
  state.recall = !!animate;
  return true;
}
function stomp(k){
  const f = FX.find(x=>x.k===k);
  if(f.dualOnly && !isDual()) return false;  /* NAM 2 only exists on a Dual Amp Sound */
  state.live[k] = state.live[k] ? 0 : 1;
  state.dirty = true;
  state.justFx = k;
  return true;
}
recall(0,false);

/* role is null for a mono Sound: BUILD only tags MAIN / SUPPORT on a Dual Amp */
function ampCard(o, role, suppFlag){
  const supp = suppFlag===undefined ? role==='SUPPORT' : suppFlag;
  return `<div class="ampcard ${supp?'support deco':'deco gold'}">

const STRIP_W = 480, STRIP_H = 208;
function fxArtHTML(f){
  const a = f.art;
  if(a.rect){
    const [x,y,w,h] = a.rect;
    return `<div class="sprite" style="background-image:url('${a.src}');`+
      `background-size:${(STRIP_W/w*100).toFixed(2)}% ${(STRIP_H/h*100).toFixed(2)}%;`+
      `background-position:${(x/(STRIP_W-w)*100).toFixed(2)}% ${(y/(STRIP_H-h)*100).toFixed(2)}%"></div>`;
  }
  return `<img src="${a.src}" alt="" style="--z:${a.z||1};--oy:${a.oy||'50%'}">`;
}

/* ═════════════ the bottom board — one per board style ═════════════ */
function fxCells(render){
  const s = cur();
  const out = [];
  FX.forEach((f,i)=>{
    if(i===4) out.push(`<i class="bdiv"></i>`);
    const na = f.dualOnly && !s.dual;
    const on = state.live[f.k] && !na;
    out.push(render(f, on, na, state.justFx===f.k));
  });
  return out.join('');
}
function boardHead(){
  return `<div class="bhead">

/* meterH = pixel height of the flanking meters inside the board */
function board(style, meterH){
  let cells;

    cells = fxCells((f,on,na,just)=>`<div class="stompcard ${on?'on':''} ${na?'na':''} ${just?'just':''}" data-fx="${f.k}">

  } else if(style==='jewels'){

      <i class="led"></i><div class="cap"></div><span class="rt">${f.t}</span></div>`);

  } else {
    cells = fxCells((f,on,na,just)=>`<div class="pedal ${on?'on':''} ${na?'na':''} ${just?'just':''}" data-fx="${f.k}">
      <div class="pengrave"><span>${f.t}</span></div>
      <div class="pimg">${fxArtHTML(f)}</div><i class="led"></i>
      <div class="fsw"><i class="knob"></i></div></div>`);

  const chassis = style==='chassis';
  return `<div class="boardband">
    <div class="bmeter ${chassis?'fmeter':''}">${meterIn(meterH)}</div>

  </div>`;
}

        <div class="epc">${s.pc}</div>
        <div class="enm">${s.name}</div>
        <div class="etg">${s.tag}</div>
        <div class="eflags">
          ${s.dual?`<span class="dualbadge">DUAL AMP</span>`:''}
          ${state.dirty?`<span class="unsavedbadge sm"><i></i>unsaved</span>`:''}
        </div>
      </div>
    </div>
    <div class="filmwrap">
      <div class="sprockets">${holes}<span class="filmtag">PROGRAM ORDER · CLICK A FRAME TO RECALL</span></div>
      <div class="frames">${frames}<div class="frame1 add" data-act="add">+</div></div>
      <div class="sprockets b">${holes}</div>
    </div>
    ${board('cards',88)}
  </div>`;
}

/* ═══════════════ F · OVERLAY RECALL ═══════════════ */
function renderF(){
  const s = cur();
  const pills = SOUNDS.map((x,i)=>{
    if(x.invalid) return `<div class="pill bad" data-bad="1"><span class="pn">${x.pc}</span></div>`;
    return `<div class="pill ${i===state.active?'act':''}" data-sound="${i}">
      <span class="pn">${x.pc}</span>${x.dual?`<i class="dt"></i>`:''}</div>`;
  }).join('');

  /* the art is blown far past its native size here, so it is treated as projected film */
  const pane = (o, role) => {
    const supp = role==='SUPPORT';
    return `<div class="bpane ${supp?'support':''}">
      ${ampArt(o, supp)}
      <div class="corona"></div><div class="grain"></div><div class="vig"></div>
      ${role?`<span class="ptag">${role} · ${o.label.toUpperCase()}</span>`:''}
      <i class="hz"></i></div>`;
  };

  return `${header()}
  <div class="bleed">
    ${pane(s.main, s.dual?'MAIN':null)}
    ${s.dual?pane(s.supp,'SUPPORT'):''}
    <div class="topscrim"></div>
    <div class="botscrim"></div>
    <div class="pills">${pills}<div class="pill add" data-act="add">+</div></div>
    <div class="pilllab">MIDI PROGRAM · CLICK TO RECALL</div>
    ${ticks}
    <div class="ftype">
      <div class="fpc">PC ${s.pc}</div>
      <div class="fnm">${s.name}</div>
      <div class="ftg">${s.tag}</div>
    </div>
    <div class="fflags">
      ${s.dual?`<span class="dualbadge">DUAL AMP · OUT L/R</span>`:''}
      ${state.dirty?`<span class="unsavedbadge sm"><i></i>unsaved</span>`:''}
      <div class="fsrc">${s.src.replace(/\s+·\s+/,'<br>')}</div>
    </div>
  </div>
  ${board('chassis',88)}`;
}

/* ═══════════════ empty scene ═══════════════ */
function renderEmpty(){
  return `${header()}<div class="empty-wrap">
    <div class="empty-mid">
      <div class="empty-ghost"><img src="../art/hero-thc-sunset.png" alt=""></div>
      <div class="empty-title">No Sounds assigned</div><div class="diamond"></div>
      <div class="empty-sub">PLAY recalls your rigs by MIDI Program Change.<br>Add a Sound to give this stage something to light up.</div>
      <div class="addbtn" data-act="add"><span class="plus">+</span>Add Sound</div>
    </div>
    <div class="empty-board">${board('cards',80)}</div>
  </div>`;
}

/* ═════════════════════════ render ═════════════════════════ */
const frame = document.getElementById('frame');
const stateline = document.getElementById('stateline');
const RENDER = {A:renderA,B:renderB,C:renderC,D:renderD,E:renderE,F:renderF};
function render(){
  frame.className = state.variant + (state.recall?' recall':'');
  frame.innerHTML = state.scene==='empty' ? renderEmpty() : RENDER[state.variant]();
  state.recall = false;
  document.getElementById('vk').textContent = VARIANTS[state.variant].k;
  document.getElementById('vd').textContent = VARIANTS[state.variant].d;
  [...document.querySelectorAll('#scenes button')].forEach(b=>b.classList.toggle('on', b.dataset.scene===state.scene));
  [...document.querySelectorAll('[data-walk]')].forEach(b=>{
    const w = +b.dataset.walk;
    b.classList.toggle('on', w!==0 && w===state.walk);
    b.classList.toggle('done', w!==0 && w<state.walk);
  });
  const s = cur();
  stateline.innerHTML =
    `<span class="sk">RECALLED</span><span class="sv hot">PC ${s.pc} · ${s.name}</span>`+
    `<span class="sk">DIRTY</span><span class="sv ${state.dirty?'hot':'cold'}">${state.dirty?'yes (unsaved)':'no'}</span>`+
    `<span class="sk">CHORUS</span><span class="sv ${state.live.chorus?'hot':'cold'}">${state.live.chorus?'on':'off'}</span>`+
    `<span class="sk">DUAL</span><span class="sv ${s.dual?'hot':'cold'}">${s.dual?'yes · out L/R':'no · mono'}</span>`+
    `<span class="sk">NAM 2</span><span class="sv ${s.dual&&state.live.nam2?'hot':'cold'}">${s.dual?(state.live.nam2?'on':'off'):'n/a'}</span>`;
  sigEl = document.getElementById('sigv'); sigShown = -99;
  apply(lastEnv, lastEnv2, lastPeak, lastPeak2);
  const liveThumb = frame.querySelector('.D .thumb.act');
  if(liveThumb) liveThumb.scrollIntoView({block:'nearest'});
}

/* ═════════════════════════ interaction ═════════════════════════ */
frame.addEventListener('click', e=>{
  const bad = e.target.closest('[data-bad]');
  if(bad){
    bad.classList.remove('shake'); void bad.offsetWidth; bad.classList.add('shake');
    if(!bad.querySelector('.deadtip')){
      const t = document.createElement('div'); t.className='deadtip'; t.textContent='NOT RECALLABLE';
      bad.appendChild(t); setTimeout(()=>t.remove(),1400);
    }
    return;
  }
  const snd = e.target.closest('[data-sound]');
  if(snd){ const i=+snd.dataset.sound; if(i!==state.active){ recall(i,true); state.walk=0; render(); } return; }
  const fx = e.target.closest('[data-fx]');
  if(fx){ if(stomp(fx.dataset.fx)){ state.walk=0; render(); } return; }
  const act = e.target.closest('[data-act]');
  if(act){
    if(act.dataset.act==='add'){ act.classList.remove('shake'); void act.offsetWidth; act.classList.add('shake'); }
    if(act.dataset.act==='build'||act.dataset.act==='play'){
      [...frame.querySelectorAll('.pb button')].forEach(b=>b.classList.toggle('on', b===act));
    }
  }
});

/* walkthrough: Recall 00 → Stomp CHORUS → Recall 01 */
function applyWalk(n){
  recall(soundByPc('00'), false);
  if(n>=2) stomp('chorus');
  if(n>=3){ recall(soundByPc('01'), false); }
  state.walk = n;
  state.recall = n>0;
  render();
}
document.querySelector('.lab-bar').addEventListener('click', e=>{
  const b = e.target.closest('[data-walk]'); if(!b) return;
  applyWalk(+b.dataset.walk);
});
document.getElementById('scenes').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  state.scene=b.dataset.scene;
  if(state.scene==='long') state.variant='D';
  if(state.active >= list().length) recall(0, false);
  render();
});
function step(d){
  state.variant = ORDER[(ORDER.indexOf(state.variant)+d+ORDER.length)%ORDER.length];
  if(state.active >= list().length) recall(0, false);
  render();
}
document.getElementById('prev').onclick = ()=>step(-1);
document.getElementById('next').onclick = ()=>step(1);
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowLeft') step(-1);
  if(e.key==='ArrowRight') step(1);
});

/* ═════════════ fake IN envelope (rAF, lighting only) ═════════════ */
const root = document.documentElement;
let lastEnv=.35, lastEnv2=.3, lastPeak=.45, lastPeak2=.4, raf=0, peak=.45, peak2=.4;
let sigEl=null, sigShown=-99;

function envAt(ms){
  const s = ms/1000;
  let v = 0.40 + 0.28*Math.sin(s*0.83) + 0.15*Math.sin(s*2.31+1.1)
              + 0.08*Math.sin(s*5.70+0.4) + 0.04*Math.sin(s*11.3+2.2);
  const phrase = 0.5 + 0.5*Math.sin(s*0.23-0.6);      /* silence between phrases */
  v *= 0.20 + 0.80*Math.pow(phrase, 0.55);
  return Math.max(0, Math.min(1, v));
}
/* the SUPPORT amp / right channel lags, so stereo reads */
function lagOf(e, ms){ return Math.max(0, Math.min(1, 0.86*envAt(ms-110) + 0.06)); }

function apply(e, e2, pk, pk2){
  root.style.setProperty('--in',  e.toFixed(4));
  root.style.setProperty('--in2', e2.toFixed(4));
  root.style.setProperty('--peak', pk.toFixed(4));
  root.style.setProperty('--peak2', pk2.toFixed(4));
  if(sigEl){
    const db = Math.round(20*Math.log10(Math.max(e,0.0004)));
    if(db!==sigShown){ sigShown=db; sigEl.textContent = (db<=-60?'-inf':db)+' dB'; }
  }
}
function tick(t){
  const e = envAt(t), e2 = lagOf(e, t);
  peak = Math.max(e, peak-0.0045); peak2 = Math.max(e2, peak2-0.0045);
  lastEnv=e; lastEnv2=e2; lastPeak=peak; lastPeak2=peak2;
  apply(e,e2,peak,peak2);
  raf = requestAnimationFrame(tick);
}
function startMotion(){ if(FREEZE!==null || raf) return; raf = requestAnimationFrame(tick); }
function stopMotion(){ if(raf){ cancelAnimationFrame(raf); raf=0; } }
document.addEventListener('visibilitychange', ()=>{ document.hidden ? stopMotion() : startMotion(); });
document.getElementById('pausebtn').onclick = function(){
  if(raf){ stopMotion(); this.textContent='Resume motion'; } else { startMotion(); this.textContent='Pause motion'; }
};

if(FREEZE!==null){
  lastEnv  = Math.max(0, Math.min(1, FREEZE));
  lastEnv2 = Math.max(0, Math.min(1, lastEnv*0.78 + 0.05));
  lastPeak = Math.min(1, lastEnv+0.09); lastPeak2 = Math.min(1, lastEnv2+0.09);
  root.setAttribute('data-freeze-in', String(lastEnv));
  document.getElementById('pausebtn').textContent = 'Frozen ' + lastEnv;
}

/* deep links for screenshots: ?sound=01 / ?pc=01 / ?walk=2 */
const sQ = qs.get('sound') !== null ? qs.get('sound') : qs.get('pc');
if(sQ!==null && sQ!==''){ const i = soundByPc(sQ); if(i>=0) recall(i,false); }
const wQ = qs.get('walk');
if(wQ!==null && wQ!==''){ applyWalk(+wQ); } else { render(); }
apply(lastEnv,lastEnv2,lastPeak,lastPeak2);
if(FREEZE===null) startMotion();
</script>
