<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VoLum PLAY · Grok</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&family=Michroma&family=Poiret+One&display=swap" rel="stylesheet">
<style>
@font-face {
  font-family: "Poiret One";
  src: url("../../../../NeuralAmpModeler/resources/fonts/PoiretOne-Regular.ttf") format("truetype");
  font-weight: 400;
  font-display: block;
}
@font-face {
  font-family: "Josefin Sans";
  src: url("../../../../NeuralAmpModeler/resources/fonts/JosefinSans-Regular.ttf") format("truetype");
  font-weight: 400;
  font-display: block;
}
@font-face {
  font-family: "Josefin Sans";
  src: url("../../../../NeuralAmpModeler/resources/fonts/JosefinSans-SemiBold.ttf") format("truetype");
  font-weight: 600;
  font-display: block;
}
@font-face {
  font-family: "Josefin Sans";
  src: url("../../../../NeuralAmpModeler/resources/fonts/JosefinSans-SemiBold.ttf") format("truetype");
  font-weight: 700;
  font-display: block;
}

:root {
  --bg: rgb(17, 17, 24);
  --bg2: rgb(12, 12, 20);
  --hero: rgb(12, 12, 18);
  --gold: rgb(252, 222, 145);
  --gold-dim: rgb(235, 210, 145);
  --brass: rgb(200, 162, 78);
  --teal: rgb(91, 196, 196);
  --cream: rgb(237, 227, 208);
  --cream-dim: rgb(166, 149, 124);
  --amber: rgb(232, 168, 92);
  --danger: rgb(228, 92, 80);
  --sel: rgb(226, 156, 112);
  --meter-g: rgb(42, 138, 42);
  --in: 0.75;
  --in2: 0.62;
  --out: 0.62;
  --out-l: 0.62;
  --out-r: 0.48;
  --corona: calc(0.1 + var(--in) * 0.62);
}

* { box-sizing: border-box; }
html, body { margin: 0; }
html { color-scheme: dark; }
body {
  min-height: 100vh;
  background: #08090d;
  color: var(--cream);
  font-family: "Josefin Sans", sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 12px 0 10px;
  overflow: hidden;
}

.plug {
  width: 900px;
  height: 600px;
  flex: 0 0 600px;
  position: relative;
  display: flex;
  flex-direction: column;
  background: linear-gradient(180deg, rgb(23, 23, 31), rgb(13, 13, 19));
  border: 1px solid rgba(200, 162, 78, 0.28);
  box-shadow: 0 18px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 248, 238, 0.06);
  overflow: hidden;
}
.plug::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0.03;
  z-index: 30;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='80' height='80'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}

.hdr {
  height: 50px;
  flex: 0 0 50px;
  display: flex;
  align-items: center;
  padding: 0 12px 0 14px;
  border-bottom: 1px solid rgba(200, 162, 78, 0.12);
  background: rgba(17, 17, 24, 0.94);
  z-index: 8;
}
.brand { width: 128px; flex: 0 0 128px; text-align: center; }
.brand .name { font: 30px/1 "Poiret One", sans-serif; color: var(--gold); }
.brand .sub {
  display: block;
  margin-top: 1px;
  font: 700 9px/1 "Josefin Sans", sans-serif;
  letter-spacing: 0.18em;
  color: var(--gold-dim);
}
.hdr-mid { flex: 1; }
.utils { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.mode { display: flex; border: 1px solid rgba(226, 156, 112, 0.92); }
.mode button {
  font: 700 11px/1 "Josefin Sans", sans-serif;
  letter-spacing: 0.12em;
  padding: 7px 11px;
  border: 0;
  background: transparent;
  color: var(--cream-dim);
  cursor: pointer;
}
.mode button.on { background: var(--gold); color: #1a1208; }
.icon {
  width: 26px; height: 26px;
  border: 1px solid rgba(200, 162, 78, 0.28);
  border-radius: 50%;
  display: grid; place-items: center;
  color: var(--gold-dim);
  position: relative;
}
.icon svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.6; }
.icon .badge {
  position: absolute; top: -2px; right: -2px;
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--teal); box-shadow: 0 0 0 2px var(--bg);
}
#stage { flex: 1; min-height: 0; position: relative; }

.deco { position: absolute; inset: 5px; pointer-events: none; }
.deco i {
  position: absolute; width: 11px; height: 11px;
  border-color: rgba(200, 162, 78, 0.88); border-style: solid;
}
.deco i:nth-child(1) { top: 0; left: 0; border-width: 1px 0 0 1px; }
.deco i:nth-child(2) { top: 0; right: 0; border-width: 1px 1px 0 0; }
.deco i:nth-child(3) { bottom: 0; left: 0; border-width: 0 0 1px 1px; }
.deco i:nth-child(4) { bottom: 0; right: 0; border-width: 0 1px 1px 0; }

img { -webkit-user-drag: none; user-select: none; display: block; }
button { font-family: inherit; }

/* lighting breathe — art stays planted; freeze stills differ by brightness */
[data-ride] {
  will-change: filter;
  filter: brightness(calc(0.54 + var(--in) * 0.82)) saturate(calc(0.86 + var(--in) * 0.22));
}
[data-ride-lag] {
  will-change: filter;
  filter: brightness(calc(0.54 + var(--in2) * 0.74)) saturate(calc(0.86 + var(--in2) * 0.18));
}
.corona {
  box-shadow:
    0 0 calc(10px + var(--in) * 34px) calc(var(--in) * 14px) rgba(252, 222, 145, var(--corona)),
    0 0 calc(4px + var(--in) * 16px) rgba(91, 196, 196, calc(var(--in) * 0.35));
}
.polaroid.front .photo::after,
.polaroid.support-front .photo::after,
.still.recalled::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 1;
  background: radial-gradient(ellipse at 50% 40%, rgba(252, 222, 145, calc(0.10 + var(--in) * 0.42)), transparent 70%);
  mix-blend-mode: soft-light;
}
.polaroid.support-front .photo::after {
  background: radial-gradient(ellipse at 50% 40%, rgba(91, 196, 196, calc(0.08 + var(--in2) * 0.38)), transparent 70%);
}

.meter { display: flex; align-items: stretch; gap: 4px; }
.meter span {
  writing-mode: vertical-rl;
  transform: rotate(180deg);
  font: 700 8px/1 "Josefin Sans", sans-serif;
  letter-spacing: 0.12em;
  color: var(--cream-dim);
}
.meter .col {
  position: relative;
  width: 8px;
  min-height: 36px;
  background: rgba(200, 162, 78, 0.12);
  box-shadow: inset 0 0 0 1px rgba(200, 162, 78, 0.22);
  overflow: hidden;
}
.meter .col .fill {
  position: absolute; left: 1px; right: 1px; bottom: 0;
  height: calc(var(--in) * 100%);
  background: linear-gradient(to top, var(--meter-g), #6adf6a 42%, var(--gold));
}
.meter.out .col .fill {
  height: calc(var(--out) * 100%);
  background: linear-gradient(to top, #1f6a6a, var(--teal) 55%, var(--gold));
}
.meter.out-l .col .fill { height: calc(var(--out-l) * 100%); }
.meter.out-r .col .fill { height: calc(var(--out-r) * 100%); }
.meter .col::after {
  content: "";
  position: absolute; inset: 0;
  background: repeating-linear-gradient(to top, transparent 0 4px, rgba(17, 17, 24, 0.92) 4px 5px);
  pointer-events: none;
}

.chip {
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  background: transparent; border: 0; cursor: pointer;
  padding: 2px 6px; min-width: 50px;
}
.chip .lab {
  font: 700 10px/1 "Josefin Sans", sans-serif;
  letter-spacing: 0.1em;
  color: var(--cream-dim);
  white-space: nowrap;
}
.chip .tog {
  width: 26px; height: 12px;
  border: 1px solid rgba(200, 162, 78, 0.35);
  border-radius: 99px;
  position: relative;
  background: rgba(200, 162, 78, 0.08);
}
.chip .tog::after {
  content: "";
  position: absolute; top: 1px; left: 1px;
  width: 8px; height: 8px; border-radius: 50%;
  background: rgb(90, 82, 72);
  transition: left 160ms ease, background 160ms ease;
}
.chip.on .lab { color: var(--gold); }
.chip.on .tog { border-color: rgba(225, 195, 115, 0.92); background: rgba(115, 88, 52, 0.42); }
.chip.on .tog::after { left: 15px; background: var(--gold); box-shadow: 0 0 6px rgba(252, 222, 145, 0.55); }
.chip.dim { opacity: 0.38; }
.chip-gap { width: 1px; height: 22px; background: rgba(200, 162, 78, 0.35); margin: 0 4px; }
.g-lab {
  font: 700 9px/1 "Josefin Sans", sans-serif;
  letter-spacing: 0.16em;
  color: var(--gold);
}
.chips-row { display: flex; align-items: center; justify-content: center; gap: 6px; min-width: 0; }

/* ===== A HUD ===== */
.hud { position: absolute; inset: 0; overflow: hidden; background: var(--hero); }
.hud-arts { position: absolute; inset: 0; }
.hud-arts .layer {
  position: absolute; inset: -8%;
  width: 116%; height: 116%;
  object-fit: cover;
  opacity: 0;
  transition: opacity 220ms ease;
}
.hud-arts .layer.show { opacity: 1; }
.hud-arts.dual .layer.main {
  inset: 8% 38% 18% 8%;
  width: auto; height: auto;
  object-fit: cover;
  border: 1px solid rgba(252, 222, 145, 0.55);
}
.hud-arts.dual .layer.support {
  inset: 14% 8% 24% 58%;
  width: auto; height: auto;
  object-fit: cover;
  opacity: 0;
  border: 1px solid rgba(91, 196, 196, 0.45);
}
.hud-arts.dual .layer.support.show { opacity: 1; }
.hud-veil {
  position: absolute; inset: 0; pointer-events: none; z-index: 2;
  background:
    linear-gradient(90deg, rgba(17, 17, 24, 0.55) 0, transparent 90px, transparent calc(100% - 70px), rgba(17, 17, 24, 0.4) 100%),
    linear-gradient(180deg, rgba(17, 17, 24, 0.12) 0, transparent 40px, transparent 58%, rgba(17, 17, 24, 0.5) 100%);
}
.lane {
  position: absolute; z-index: 5;
  font: 700 9px/1 "Josefin Sans", sans-serif;
  letter-spacing: 0.16em;
  pointer-events: none;
}
.lane.main { left: 12%; top: 10%; color: var(--gold); }
.lane.support { right: 12%; top: 16%; color: var(--teal); }
.hud-rail {
  position: absolute; top: 10px; left: 10px; bottom: 14px; width: 58px;
  z-index: 4;
  display: flex; flex-direction: column; gap: 6px;
  padding: 8px 5px;
  background: rgba(17, 17, 24, 0.58);
  border: 1px solid rgba(200, 162, 78, 0.3);
}
.hud-rail .thumb {
  position: relative; height: 46px; flex: 0 0 46px;
  border: 1px solid rgba(200, 162, 78, 0.22);
  background: #0a0a10; cursor: pointer; overflow: hidden; padding: 0;
}
.hud-rail .thumb img { width: 100%; height: 100%; object-fit: cover; }
.hud-rail .thumb .pc {
  position: absolute; left: 2px; bottom: 2px;
  font: 400 7px/1 "Michroma", sans-serif; color: var(--gold);
  text-shadow: 0 1px 4px #000;
}
.hud-rail .thumb.on {
  border-color: var(--gold);
  box-shadow: 0 0 0 1px var(--gold), inset 2px 0 0 var(--gold);
}
.hud-rail .thumb.invalid {
  cursor: default; border-style: dashed; border-color: rgba(228, 92, 80, 0.55);
  display: grid; place-items: center;
}
.hud-rail .thumb.invalid .pc { color: var(--danger); position: static; }
.hud-rail .add-mini {
  margin-top: auto; height: 26px; flex: 0 0 26px;
  border: 1px solid rgba(91, 196, 196, 0.4);
  background: transparent; color: var(--teal);
  font: 700 16px/1 "Josefin Sans", sans-serif; cursor: pointer;
}
.hud-pre, .hud-post {
  position: absolute; z-index: 4; width: 76px;
  padding: 8px 4px 10px;
  background: rgba(17, 17, 24, 0.72);
  border: 1px solid rgba(200, 162, 78, 0.4);
  display: flex; flex-direction: column; align-items: center; gap: 6px;
}
.hud-pre { left: 78px; top: 12px; }
.hud-post { right: 88px; top: 12px; }
.hud-pre .chips-row, .hud-post .chips-row { flex-direction: column; gap: 7px; }
.hud-pre .chip, .hud-post .chip { min-width: 0; padding: 2px 0; }
.hud-id {
  position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
  z-index: 4; min-width: 300px; padding: 10px 18px;
  background: rgba(17, 17, 24, 0.74);
  border: 1px solid rgba(200, 162, 78, 0.42);
  text-align: center;
}
.hud-id .pc { font: 400 10px/1 "Michroma", sans-serif; color: var(--gold); }
.hud-id h2 { margin: 5px 0 0; font: 700 24px/1 "Josefin Sans", sans-serif; color: var(--gold); }
.hud-id .sub { margin-top: 4px; font: 400 12px/1 "Josefin Sans", sans-serif; color: var(--cream-dim); }
.hud-id .sub b { color: var(--amber); font-size: 10px; letter-spacing: 0.12em; margin-left: 8px; text-transform: uppercase; }
.hud-id .dia {
  width: 6px; height: 6px; margin: 7px auto 0;
  border: 1px solid var(--gold-dim); transform: rotate(45deg);
}
.hud-meters {
  position: absolute; right: 12px; bottom: 16px; height: 168px;
  z-index: 4;
  display: flex; align-items: stretch; gap: 7px;
  padding: 8px 8px 6px;
  background: rgba(17, 17, 24, 0.64);
  border: 1px solid rgba(200, 162, 78, 0.38);
}
.hud-meters .meter .col { height: auto; align-self: stretch; }

/* ===== B POLAROIDS ===== */
.stack { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 38%, rgba(252, 222, 145, 0.07), transparent 52%), rgb(12, 12, 18); }
.stack-floor { position: absolute; inset: 0 0 80px; overflow: hidden; }
.polaroid {
  position: absolute;
  width: 168px; height: 172px;
  padding: 5px 5px 0;
  background: rgb(32, 28, 18);
  border: 1px solid rgba(200, 162, 78, 0.78);
  box-shadow: 0 16px 36px rgba(0, 0, 0, 0.55);
  overflow: hidden; cursor: pointer;
  transform: rotate(var(--rot, 0deg));
  transition: transform 240ms cubic-bezier(.22, .75, .2, 1), left 240ms cubic-bezier(.22, .75, .2, 1), top 240ms cubic-bezier(.22, .75, .2, 1), width 240ms, height 240ms;
  z-index: 2;
  display: flex; flex-direction: column;
}
.polaroid .photo { position: relative; flex: 1; min-height: 0; overflow: hidden; background: #0b0b11; }
.polaroid img { position: absolute; inset: -8%; width: 116%; height: 116%; object-fit: cover; }
.polaroid .cap {
  flex: 0 0 28px; display: flex; align-items: center; justify-content: space-between;
  padding: 0 6px; background: rgb(26, 22, 14);
}
.polaroid .cap .nm { font: 700 11px/1 "Josefin Sans", sans-serif; color: var(--cream); }
.polaroid .cap .pc { font: 400 8px/1 "Michroma", sans-serif; color: var(--gold); }
.polaroid .tag {
  position: absolute; top: 8px; left: 8px; z-index: 3;
  font: 700 8px/1 "Josefin Sans", sans-serif; letter-spacing: 0.14em;
}
.polaroid.front {
  width: 340px; height: 340px; left: 200px; top: 22px;
  --rot: 0deg; z-index: 8;
  border-color: var(--gold);
  box-shadow: 0 22px 48px rgba(0, 0, 0, 0.62), 0 0 0 1px var(--gold);
}
.polaroid.front .cap .nm { font-size: 14px; color: var(--gold); }
.polaroid.support-front {
  width: 210px; height: 228px; left: 520px; top: 78px;
  --rot: 3deg; z-index: 9;
  border-color: var(--teal);
}
.polaroid.support-front .tag { color: var(--teal); }
.polaroid.front .tag { color: var(--gold); }
.polaroid.invalid { cursor: default; border-color: rgba(228, 92, 80, 0.5); background: rgb(28, 16, 16); }
.polaroid.invalid .sleeve {
  position: absolute; inset: 10px;
  border: 1px dashed rgba(228, 92, 80, 0.5);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
}
.polaroid.invalid .sleeve .big { font: 400 22px/1 "Michroma", sans-serif; color: var(--danger); }
.polaroid.invalid .sleeve .tag { font: 700 9px/1 "Josefin Sans", sans-serif; letter-spacing: 0.16em; color: var(--danger); position: static; }
.polaroid.add-card {
  width: 88px; height: 88px; display: flex; align-items: center; justify-content: center;
  padding: 0; border-color: rgba(91, 196, 196, 0.55); color: var(--teal);
  font: 700 28px/1 "Josefin Sans", sans-serif; background: rgba(12, 12, 20, 0.92); z-index: 6;
}
.stack-dock {
  position: absolute; left: 0; right: 0; bottom: 0; height: 80px;
  display: grid; grid-template-columns: 40px 1fr 72px;
  align-items: center; gap: 8px; padding: 0 12px;
  background: rgb(24, 20, 12);
  border-top: 2px solid var(--gold);
  z-index: 10;
}
.stack-dock .meter .col { height: 52px; }
.outs { display: flex; gap: 6px; }

/* ===== C FILM ===== */
.film { position: absolute; inset: 0; background: #08080c; }
.film-scroll {
  position: absolute; inset: 0 0 78px;
  overflow-y: auto; overflow-x: hidden;
  scrollbar-width: thin; scrollbar-color: rgba(200, 162, 78, 0.4) transparent;
}
.film-strip { display: flex; align-items: flex-start; height: auto; }
.sprockets {
  flex: 0 0 20px; background: #0a0a0e;
  display: flex; flex-direction: column; align-items: center; padding: 8px 0; gap: 10px;
}
.sprockets i {
  width: 8px; height: 10px; flex: 0 0 10px;
  border: 1px solid rgba(252, 222, 145, 0.35); border-radius: 2px; background: #08080c;
}
.frames {
  flex: 1 0 auto; min-width: 0;
  padding: 8px 0 12px;
  display: flex; flex-direction: column; gap: 7px;
  height: max-content;
}
.still {
  display: block; width: 100%;
  position: relative;
  height: 118px; min-height: 118px; flex: 0 0 118px; flex-shrink: 0;
  overflow: hidden;
  border: 1px solid rgba(200, 162, 78, 0.28);
  background: #0b0b11; cursor: pointer;
  appearance: none; color: inherit;
}
.still img { position: absolute; inset: -8%; width: 116%; height: 116%; object-fit: cover; }
.still .burn {
  position: absolute; right: 12px; bottom: 6px;
  font: 400 36px/1 "Michroma", sans-serif;
  color: rgba(252, 222, 145, 0.22); pointer-events: none;
}
.still .meta {
  position: absolute; left: 12px; bottom: 8px; z-index: 2;
  text-shadow: 0 1px 10px #000;
}
.still .meta .nm { font: 700 14px/1 "Josefin Sans", sans-serif; color: #fff; }
.still .meta .ps { margin-top: 3px; font: 400 11px/1 "Josefin Sans", sans-serif; color: var(--cream-dim); }
.still.recalled {
  height: 210px; min-height: 210px; flex: 0 0 210px;
  border-color: var(--gold);
  box-shadow: inset 0 0 0 1px var(--gold);
}
.still.recalled.dual { height: 228px; min-height: 228px; flex: 0 0 228px; }
.still.recalled .pair {
  position: absolute; inset: 0;
  display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
}
.still.recalled .pair > div { position: relative; overflow: hidden; }
.still.recalled .pair img { inset: -8%; }
.still.recalled .pair .lab {
  position: absolute; top: 8px; left: 8px;
  font: 700 9px/1 "Josefin Sans", sans-serif; letter-spacing: 0.14em;
}
.still.invalid {
  display: flex; align-items: center; justify-content: center; gap: 16px;
  height: 84px; min-height: 84px; flex: 0 0 84px;
  cursor: default; border-style: dashed; border-color: rgba(228, 92, 80, 0.5);
  background: repeating-linear-gradient(-45deg, rgba(228, 92, 80, 0.05) 0 8px, transparent 8px 16px), #0b0b11;
}
.still.invalid .burn { color: rgba(228, 92, 80, 0.35); position: static; font-size: 28px; }
.still.invalid .itag { font: 700 11px/1 "Josefin Sans", sans-serif; letter-spacing: 0.18em; color: var(--danger); }
.still.add-still {
  display: grid; place-items: center;
  height: 48px; min-height: 48px; flex: 0 0 48px;
  border-color: rgba(91, 196, 196, 0.4); color: var(--teal);
  font: 700 12px/1 "Josefin Sans", sans-serif; letter-spacing: 0.16em;
}
.film-dock {
  position: absolute; left: 0; right: 0; bottom: 0; height: 78px;
  display: grid; grid-template-columns: 40px 1fr 72px;
  align-items: center; gap: 8px; padding: 0 12px;
  background: rgba(17, 17, 24, 0.96);
  border-top: 2px solid var(--gold);
  z-index: 6;
}
.film-dock .meter .col { height: 50px; }

.empty {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
  background: radial-gradient(ellipse at 50% 42%, rgba(252, 222, 145, 0.08), transparent 50%), var(--hero);
}
.empty .mark {
  width: 12px; height: 12px; border: 1px solid var(--gold-dim); transform: rotate(45deg);
}
.empty p {
  margin: 0; font: 400 22px/1 "Poiret One", sans-serif;
  letter-spacing: 0.12em; color: var(--gold); text-transform: uppercase;
}
.empty .hint { font: 400 12px/1 "Josefin Sans", sans-serif; color: var(--cream-dim); }
.add {
  font: 700 11px/1 "Josefin Sans", sans-serif;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: #1a1208; background: var(--gold); border: 0; padding: 9px 16px; cursor: pointer;
}
.build-ph {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  background: var(--hero);
}
.build-ph h2 { margin: 0; font: 400 36px/1 "Poiret One", sans-serif; letter-spacing: 0.2em; color: var(--gold); }
.build-ph p { margin: 0; font: 400 12px/1 "Josefin Sans", sans-serif; letter-spacing: 0.1em; color: var(--cream-dim); }
.sheet {
  position: absolute; inset: 70px 200px 90px;
  background: rgb(23, 23, 31); border: 1px solid var(--sel); padding: 16px; z-index: 12;
}
.sheet h3 { margin: 0 0 12px; font: 700 12px/1 "Josefin Sans", sans-serif; letter-spacing: 0.14em; color: var(--gold); }
.sheet button {
  display: block; width: 100%; text-align: left;
  background: var(--bg2); border: 1px solid rgba(200, 162, 78, 0.18);
  color: var(--cream); padding: 9px 10px; margin-bottom: 4px;
  font: 600 13px "Josefin Sans", sans-serif; cursor: pointer;
}

.float {
  width: 900px; margin-top: 10px;
  display: flex; flex-direction: column; gap: 8px;
}
.float-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.scene-tog, .var-tog, .walk { display: flex; align-items: center; }
.scene-tog button, .var-tog button, .var-tog .lab, .walk button {
  font: 700 10px/1 "Josefin Sans", sans-serif;
  letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--teal); background: transparent;
  border: 1px solid rgba(91, 196, 196, 0.35);
  padding: 7px 10px; cursor: pointer;
}
.scene-tog button.on, .walk button.on, .var-tog .lab {
  color: #1a1208; background: var(--amber); border-color: var(--amber);
}
.var-tog .lab { min-width: 150px; text-align: center; cursor: default; }
.walk { gap: 0; }
.state-line {
  font: 400 11px/1.4 "Michroma", sans-serif;
  letter-spacing: 0.04em;
  color: var(--gold-dim);
  padding: 2px 0 0;
}
.state-line b { color: var(--gold); font-weight: 400; }
[hidden] { display: none !important; }
</style>
<script>
(function boot() {
  const q = new URLSearchParams(location.search);
  const v = (q.get("variant") || "A").toUpperCase();
  document.documentElement.dataset.variant = "ABC".includes(v) ? v : "A";
  const f = q.get("freeze");
  if (f != null && f !== "") {
    document.documentElement.dataset.freezeIn = f;
    document.documentElement.style.setProperty("--in", f);
    const n = Number(f);
    document.documentElement.style.setProperty("--out", String(Math.max(0, n * 0.78)));
    document.documentElement.style.setProperty("--out-l", String(Math.max(0, n * 0.86)));
    document.documentElement.style.setProperty("--out-r", String(Math.max(0, n * 0.58)));
  }
  if (q.get("empty") === "1" || q.get("scene") === "empty") document.documentElement.dataset.empty = "1";
  if (q.get("pc")) document.documentElement.dataset.pc = q.get("pc");
  if (q.get("walk")) document.documentElement.dataset.walk = q.get("walk");
})();
</script>
</head>
<body>
<div class="plug" id="plug" aria-label="VoLum 900 by 600 PLAY prototype">
  <header class="hdr">
    <div class="brand">
      <div class="name">VoLum</div>
      <span class="sub">NAM PLAYER</span>
    </div>
    <div class="hdr-mid"></div>
    <div class="utils">
      <div class="mode">
        <button type="button" id="btnPlay" class="on">PLAY</button>
        <button type="button" id="btnBuild">BUILD</button>
      </div>
      <div class="icon" title="Tuner"><svg viewBox="0 0 16 16"><path d="M8 2v8"/><circle cx="8" cy="12" r="2.2"/><path d="M6 5h4"/></svg></div>
      <div class="icon" title="Metronome"><svg viewBox="0 0 16 16"><path d="M4.5 14h7L9 2.8H7L4.5 14z"/><path d="M8 3.2 12.2 9"/><circle cx="8" cy="11.5" r="1"/></svg></div>
      <div class="icon" title="Settings"><svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.1"/><path d="M8 2.4v1.4M8 12.2v1.4M2.4 8h1.4M12.2 8h1.4M4 4l1 1M11 11l1 1M12 4l-1 1M5 11l-1 1"/></svg><span class="badge"></span></div>
    </div>
  </header>
  <div id="stage"></div>
</div>
<nav class="float" aria-label="Prototype controls">
  <div class="float-row">
    <div class="scene-tog">
      <button type="button" data-scene="gig" class="on">Gig</button>
      <button type="button" data-scene="empty">Empty</button>
    </div>
    <div class="var-tog">
      <button type="button" id="prevV">←</button>
      <div class="lab" id="varLab">HUD Overlay</div>
      <button type="button" id="nextV">→</button>
    </div>
  </div>
  <div class="float-row">
    <div class="walk">
      <button type="button" data-walk="0">1 Recall 00</button>
      <button type="button" data-walk="1">2 Stomp CHORUS</button>
      <button type="button" data-walk="2">3 Recall 01</button>
    </div>
  </div>
  <div class="state-line" id="stateLine">recalled PC 00 · dirty no · chorus off · dual no</div>
</nav>
<script>
const VARIANTS = { A: "HUD Overlay", B: "Tactile Stack", C: "Vertical Film" };
const CHIPS = [
  { id: "pitch", label: "PITCH", group: "pre" },
  { id: "comp", label: "COMP", group: "pre" },
  { id: "nam1", label: "NAM 1", group: "pre" },
  { id: "nam2", label: "NAM 2", group: "pre" },
  { id: "chorus", label: "CHORUS", group: "post" },
  { id: "delay", label: "DELAY", group: "post" },
  { id: "reverb", label: "REVRB", group: "post" },
  { id: "trem", label: "TREM", group: "post" }
];
function snap(o) { return Object.assign({ pitch: false, comp: true, nam1: false, nam2: false, chorus: false, delay: false, reverb: true, trem: false }, o); }
const GIG = [
  { pc: 0, name: "THC Sunset", preset: "Crunch", art: "../art/hero-thc-sunset.png", dual: false, dirty: false, bypass: snap({ chorus: false, nam2: false }) },
  { pc: 1, name: "Marshall 2204", preset: "Lead", art: "../art/hero-marshall-2204.png", support: "../art/hero-jmp-2203.png", dual: true, dirty: false, bypass: snap({ nam2: true, delay: true, chorus: false }) },
  { pc: 4, invalid: true },
  { pc: 7, name: "Orange ORS100", preset: "Clean", art: "../art/hero-jmp-2203.png", dual: false, dirty: false, bypass: snap({ reverb: false, chorus: false }) },
  { pc: 12, name: "Monomyth Skele1", preset: "Room", art: "../art/hero-thc-sunset.png", dual: false, custom: true, dirty: false, bypass: snap({ reverb: true, delay: true }) }
];
const PARK = {
  0: { l: 28, t: 36, rot: "-8deg" },
  1: { l: 28, t: 36, rot: "-8deg" },
  4: { l: 700, t: 16, rot: "7deg" },
  7: { l: 24, t: 236, rot: "5deg" },
  12: { l: 684, t: 236, rot: "-6deg" }
};
const bootPc = Number(document.documentElement.dataset.pc || "0");
const freezeQ = document.documentElement.dataset.freezeIn;
const freeze = freezeQ != null && freezeQ !== "" ? Number(freezeQ) : null;

const state = {
  variant: document.documentElement.dataset.variant || "A",
  empty: document.documentElement.dataset.empty === "1",
  mode: "play",
  recalled: Number.isFinite(bootPc) ? bootPc : 0,
  walk: 0,
  sheet: false
};
if (!GIG.find((s) => s.pc === state.recalled && !s.invalid)) state.recalled = 0;

function deco() { return `<div class="deco" aria-hidden="true"><i></i><i></i><i></i><i></i></div>`; }
function pcStr(n) { return String(n).padStart(2, "0"); }
function rec() { return GIG.find((s) => s.pc === state.recalled && !s.invalid) || GIG[0]; }
function live() { return rec().bypass; }

function metersHtml() {
  const dual = rec().dual;
  const inn = `<div class="meter"><span>IN</span><div class="col"><div class="fill"></div></div></div>`;
  const out = dual
    ? `<div class="outs"><div class="meter out out-l"><div class="col"><div class="fill"></div></div><span>OUT L</span></div><div class="meter out out-r"><div class="col"><div class="fill"></div></div><span>OUT R</span></div></div>`
    : `<div class="meter out"><div class="col"><div class="fill"></div></div><span>OUT</span></div>`;
  return { inn, out };
}
function chipsHtml(group) {
  const list = group ? CHIPS.filter((c) => c.group === group) : CHIPS;
  const bits = [];
  const bp = live();
  const dual = rec().dual;
  if (!group) bits.push(`<span class="g-lab">PRE</span>`);
  list.forEach((c, i) => {
    if (!group && i === 4) bits.push(`<span class="chip-gap"></span><span class="g-lab">POST</span>`);
    const on = bp[c.id] ? " on" : "";
    const dim = (c.id === "nam2" && !dual) ? " dim" : "";
    bits.push(`<button type="button" class="chip${on}${dim}" data-chip="${c.id}"><span class="lab">${c.label}</span><span class="tog"></span></button>`);
  });
  return `<div class="chips-row">${bits.join("")}</div>`;
}

function renderA() {
  const r = rec();
  const dirty = r.dirty ? `<b>(unsaved)</b>` : "";
  const m = metersHtml();
  const layers = GIG.filter((s) => s.art).map((s) => {
    const show = s.pc === r.pc ? " show corona" : "";
    const ride = s.pc === r.pc ? " data-ride" : "";
    return `<img class="layer main${show}" src="${s.art}" alt="" data-pc="${s.pc}"${ride}>`;
  }).join("");
  const support = r.dual
    ? `<img class="layer support show corona" src="${r.support}" alt="SUPPORT" data-ride-lag>`
    : "";
  const lanes = r.dual ? `<span class="lane main">MAIN</span><span class="lane support">SUPPORT</span>` : "";
  const thumbs = GIG.map((s) => {
    if (s.invalid) return `<button type="button" class="thumb invalid" data-pc="${s.pc}"><span class="pc">${pcStr(s.pc)}</span></button>`;
    return `<button type="button" class="thumb${s.pc === r.pc ? " on" : ""}" data-pc="${s.pc}"><img src="${s.art}" alt=""><span class="pc">${pcStr(s.pc)}</span></button>`;
  }).join("");
  return `<div class="hud">
    <div class="hud-arts${r.dual ? " dual" : ""}">${layers}${support}</div>
    <div class="hud-veil"></div>
    ${lanes}
    <aside class="hud-rail">${deco()}${thumbs}<button type="button" class="add-mini" data-add>+</button></aside>
    <div class="hud-id">${deco()}<div class="pc">PC ${pcStr(r.pc)}</div><h2>${r.name}</h2><div class="sub">${r.preset}${dirty}</div><div class="dia"></div></div>
    <div class="hud-pre">${deco()}<span class="g-lab">PRE</span>${chipsHtml("pre")}</div>
    <div class="hud-post">${deco()}<span class="g-lab">POST</span>${chipsHtml("post")}</div>
    <div class="hud-meters">${deco()}${m.inn}${m.out}</div>
  </div>`;
}

function renderB() {
  const r = rec();
  const m = metersHtml();
  const cards = GIG.map((s) => {
    const park = PARK[s.pc];
    const front = !s.invalid && s.pc === r.pc;
    if (s.invalid) {
      return `<div class="polaroid invalid" data-pc="${s.pc}" style="left:${park.l}px;top:${park.t}px;--rot:${park.rot}">
        ${deco()}<div class="photo"><div class="sleeve"><span class="big">${pcStr(s.pc)}</span><span class="tag">INVALID</span></div></div>
        <div class="cap"><span class="nm">empty sleeve</span><span class="pc">${pcStr(s.pc)}</span></div></div>`;
    }
    const left = front ? 168 : park.l;
    const top = front ? 18 : park.t;
    const rot = front ? "0deg" : park.rot;
    const ride = front ? " data-ride" : "";
    const dirty = s.dirty && front ? " (unsaved)" : "";
    return `<button type="button" class="polaroid${front ? " front corona" : ""}" data-pc="${s.pc}" style="left:${left}px;top:${top}px;--rot:${rot}">
      ${deco()}${front && r.dual ? `<span class="tag">MAIN</span>` : ""}
      <div class="photo"><img src="${s.art}" alt="${s.name}"${ride}></div>
      <div class="cap"><span class="nm">${s.name}${dirty}</span><span class="pc">${pcStr(s.pc)}</span></div>
    </button>`;
  }).join("");
  const support = r.dual
    ? `<button type="button" class="polaroid support-front corona" data-pc="1" style="left:520px;top:72px;--rot:3deg">
        ${deco()}<span class="tag">SUPPORT</span>
        <div class="photo"><img src="${r.support}" alt="JMP 2203" data-ride-lag></div>
        <div class="cap"><span class="nm">Marshall JMP 2203</span><span class="pc">01</span></div>
      </button>`
    : "";
  return `<div class="stack"><div class="stack-floor">${cards}${support}
    <button type="button" class="polaroid add-card" data-add style="left:792px;top:160px;--rot:11deg">+</button>
    </div>
    <div class="stack-dock">${m.inn}${chipsHtml()}${m.out}</div></div>`;
}

function renderC() {
  const r = rec();
  const m = metersHtml();
  const frames = GIG.map((s) => {
    if (s.invalid) {
      return `<div class="still invalid" data-pc="${s.pc}">${deco()}<span class="burn">${pcStr(s.pc)}</span><span class="itag">INVALID</span></div>`;
    }
    const recd = s.pc === r.pc;
    const dirty = s.dirty && recd ? " · (unsaved)" : "";
    if (recd && s.dual) {
      return `<button type="button" class="still recalled dual corona" data-pc="${s.pc}">
        ${deco()}
        <div class="pair">
          <div><img src="${s.art}" alt="" data-ride><span class="lab" style="color:var(--gold)">MAIN</span></div>
          <div><img src="${s.support}" alt="" data-ride-lag><span class="lab" style="color:var(--teal)">SUPPORT</span></div>
        </div>
        <div class="meta"><div class="nm">${s.name}</div><div class="ps">${s.preset}${dirty}</div></div>
        <span class="burn">${pcStr(s.pc)}</span>
      </button>`;
    }
    return `<button type="button" class="still${recd ? " recalled corona" : ""}" data-pc="${s.pc}">
      ${deco()}<img src="${s.art}" alt="${s.name}"${recd ? " data-ride" : ""}>
      <div class="meta"><div class="nm">${s.name}</div><div class="ps">${s.preset}${dirty}</div></div>
      <span class="burn">${pcStr(s.pc)}</span>
    </button>`;
  }).join("");
  return `<div class="film"><div class="film-scroll"><div class="film-strip">
    <div class="sprockets">${"<i></i>".repeat(26)}</div>
    <div class="frames">${frames}<button type="button" class="still add-still" data-add>+ ADD SOUND</button></div>
    <div class="sprockets">${"<i></i>".repeat(26)}</div>
  </div></div>
  <div class="film-dock">${m.inn}${chipsHtml()}${m.out}</div></div>`;
}

function renderEmpty() {
  return `<div class="empty">${deco()}<div class="mark"></div><p>No Sounds assigned</p><span class="hint">Assign a Sound to a Program Change</span><button type="button" class="add" data-add>Add</button></div>`;
}
function renderBuild() {
  return `<div class="build-ph">${deco()}<h2>BUILD</h2><p>today’s editor · sidebar · triptych · knobs</p></div>`;
}
function renderSheet() {
  return `<div class="sheet"><h3>ADD SOUND</h3>
    <button type="button" data-close-sheet>Cancel</button></div>`;
}

function updateStateLine() {
  const r = rec();
  const el = document.getElementById("stateLine");
  el.textContent = `recalled PC ${pcStr(r.pc)} · dirty ${r.dirty ? "yes" : "no"} · chorus ${r.bypass.chorus ? "on" : "off"} · dual ${r.dual ? "yes" : "no"}`;
  document.querySelectorAll("[data-walk]").forEach((b) => b.classList.toggle("on", Number(b.dataset.walk) === state.walk));
}

function render() {
  const stage = document.getElementById("stage");
  if (state.mode === "build") { stage.innerHTML = renderBuild(); updateStateLine(); return; }
  if (state.empty) { stage.innerHTML = renderEmpty() + (state.sheet ? renderSheet() : ""); updateStateLine(); return; }
  const body = state.variant === "B" ? renderB() : state.variant === "C" ? renderC() : renderA();
  stage.innerHTML = body + (state.sheet ? renderSheet() : "");
  applyIn(currentIn);
  updateStateLine();
}

function recall(pc) {
  const slot = GIG.find((s) => s.pc === pc);
  if (!slot || slot.invalid) return;
  state.recalled = pc;
  render();
}
function stomp(id) {
  const r = rec();
  r.bypass[id] = !r.bypass[id];
  r.dirty = true;
  render();
}
function walkTo(step) {
  state.walk = step;
  if (step === 0) {
    GIG[0].dirty = false;
    GIG[0].bypass.chorus = false;
    recall(0);
  } else if (step === 1) {
    state.recalled = 0;
    GIG[0].bypass.chorus = true;
    GIG[0].dirty = true;
    render();
  } else {
    recall(1);
  }
}

function setVariant(v) {
  state.variant = v;
  document.documentElement.dataset.variant = v;
  document.getElementById("varLab").textContent = VARIANTS[v];
  const url = new URL(location.href);
  url.searchParams.set("variant", v);
  if (freeze != null) url.searchParams.set("freeze", String(freeze));
  url.searchParams.set("pc", String(state.recalled));
  if (state.empty) url.searchParams.set("empty", "1");
  else url.searchParams.delete("empty");
  history.replaceState(null, "", url);
  render();
}

let currentIn = freeze != null && !Number.isNaN(freeze) ? freeze : 0.75;
let raf = 0;
function applyIn(v) {
  currentIn = v;
  document.documentElement.style.setProperty("--in", String(v));
  document.documentElement.style.setProperty("--in2", String(Math.max(0, Math.min(1, v * 0.86 + 0.04))));
  const dual = rec().dual;
  document.documentElement.style.setProperty("--out", String(Math.max(0, Math.min(1, v * 0.78))));
  document.documentElement.style.setProperty("--out-l", String(Math.max(0, Math.min(1, v * 0.86))));
  document.documentElement.style.setProperty("--out-r", String(Math.max(0, Math.min(1, v * (dual ? 0.58 : 0.78)))));
}
function envelopeAt(t) {
  const swell = 0.5 + 0.34 * Math.sin(t / 1600);
  const jitter = 0.04 * Math.sin(t / 90) + 0.02 * Math.sin(t / 39);
  const drop = 0.55 + 0.45 * (0.5 + 0.5 * Math.sin(t / 4000));
  return Math.max(0, Math.min(1, swell * drop + jitter));
}
function loop(now) {
  if (document.hidden) { raf = 0; return; }
  applyIn(envelopeAt(now));
  raf = requestAnimationFrame(loop);
}
function kickLoop() {
  if (freeze != null || raf) return;
  raf = requestAnimationFrame(loop);
}
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { if (raf) cancelAnimationFrame(raf); raf = 0; }
  else if (freeze == null) kickLoop();
});

document.getElementById("stage").addEventListener("click", (e) => {
  if (e.target.closest("[data-add]")) { state.sheet = true; render(); return; }
  if (e.target.closest("[data-close-sheet]")) { state.sheet = false; render(); return; }
  const chip = e.target.closest("[data-chip]");
  if (chip) { stomp(chip.getAttribute("data-chip")); return; }
  const pcEl = e.target.closest("[data-pc]");
  if (!pcEl) return;
  recall(Number(pcEl.getAttribute("data-pc")));
});
document.getElementById("btnPlay").addEventListener("click", () => {
  state.mode = "play";
  document.getElementById("btnPlay").classList.add("on");
  document.getElementById("btnBuild").classList.remove("on");
  render();
});
document.getElementById("btnBuild").addEventListener("click", () => {
  state.mode = "build";
  document.getElementById("btnBuild").classList.add("on");
  document.getElementById("btnPlay").classList.remove("on");
  render();
});
document.querySelectorAll("[data-scene]").forEach((b) => {
  b.addEventListener("click", () => {
    state.empty = b.getAttribute("data-scene") === "empty";
    document.querySelectorAll("[data-scene]").forEach((x) => x.classList.toggle("on", x === b));
    setVariant(state.variant);
  });
});
document.querySelectorAll("[data-walk]").forEach((b) => {
  b.addEventListener("click", () => walkTo(Number(b.dataset.walk)));
});
document.getElementById("prevV").addEventListener("click", () => {
  const o = ["A", "B", "C"];
  setVariant(o[(o.indexOf(state.variant) + 2) % 3]);
});
document.getElementById("nextV").addEventListener("click", () => {
  const o = ["A", "B", "C"];
  setVariant(o[(o.indexOf(state.variant) + 1) % 3]);
});
document.addEventListener("keydown", (e) => {
  if (e.key === "ArrowLeft") { e.preventDefault(); document.getElementById("prevV").click(); }
  if (e.key === "ArrowRight") { e.preventDefault(); document.getElementById("nextV").click(); }
});

document.getElementById("varLab").textContent = VARIANTS[state.variant];
document.querySelectorAll("[data-scene]").forEach((b) => {
  b.classList.toggle("on", (b.getAttribute("data-scene") === "empty") === state.empty);
});
if (document.documentElement.dataset.walk != null) {
  walkTo(Number(document.documentElement.dataset.walk));
} else {
  if (state.recalled === 1) state.walk = 2;
  render();
}
if (freeze != null) applyIn(freeze);
else kickLoop();
</script>
</body>
</html>
