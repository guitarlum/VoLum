name: Release Native

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "How to choose the release version."
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - manual
      manual_version:
        description: "Manual version override, for example 0.3.0. Only used when release_type is manual."
        required: false
        type: string
      rebuild_assets:
        description: "Build and upload assets for an existing tag. Skips the version bump. Set manual_version to that release, for example 1.3.0."
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Opt-in. Build the Linux tarball from this ref and upload it only as a workflow artifact. Does not commit, push, tag, or create a release. Leave this false to release main, whichever branch the dispatch was started from."
        required: false
        type: boolean
        default: false

env:
  PROJECT_NAME: NeuralAmpModeler

permissions:
  contents: read

concurrency:
  group: release-native
  cancel-in-progress: false

jobs:
  prepare_release:
    name: Prepare release
    if: inputs.dry_run != true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_tag: ${{ steps.meta.outputs.tag }}
      release_version: ${{ steps.meta.outputs.version }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - name: Check out repository
        if: inputs.rebuild_assets != true && inputs.dry_run != true
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          submodules: false

      - name: Check out submodules
        if: inputs.rebuild_assets != true && inputs.dry_run != true
        run: bash NeuralAmpModeler/scripts/checkout-submodules.sh
        shell: bash

      - name: Prepare release metadata
        if: inputs.rebuild_assets != true && inputs.dry_run != true
        id: prepare
        run: |
          VERSION_ARGS=()
          BUMP_TYPE="${{ inputs.release_type }}"

          if [ "$BUMP_TYPE" = "manual" ]; then
            if [ -z "${{ inputs.manual_version }}" ]; then
              echo "manual_version is required when release_type is manual" >&2
              exit 1
            fi
            VERSION_ARGS+=(--version "${{ inputs.manual_version }}")
            BUMP_TYPE="minor"
          fi

          python3 prepare_release.py --bump "$BUMP_TYPE" "${VERSION_ARGS[@]}" --github-output "$GITHUB_OUTPUT"
        shell: bash

      - name: Commit release metadata
        if: inputs.rebuild_assets != true && inputs.dry_run != true
        run: |
          git add \
            NeuralAmpModeler/config.h \
            NeuralAmpModeler/installer/changelog.txt \
            NeuralAmpModeler/installer/VoLum.iss \
            NeuralAmpModeler/resources/*.plist
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "release: prepare ${{ steps.prepare.outputs.tag }}"
        shell: bash

      - name: Push release commit
        if: inputs.rebuild_assets != true && inputs.dry_run != true
        run: git push origin HEAD:main
        shell: bash

      - name: Create and push release tag
        if: inputs.rebuild_assets != true && inputs.dry_run != true
        run: |
          git tag "${{ steps.prepare.outputs.tag }}"
          git push origin "${{ steps.prepare.outputs.tag }}"
        shell: bash

      - name: Create draft release
        if: inputs.rebuild_assets != true && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.prepare.outputs.tag }}" \
            --draft \
            --generate-notes \
            --title "VoLum ${{ steps.prepare.outputs.tag }}"
        shell: bash

      - name: Export release coordinates
        id: meta
        run: |
          if [ "${{ inputs.rebuild_assets }}" = "true" ]; then
            version="${{ inputs.manual_version }}"
            if [ -z "$version" ]; then
              echo "manual_version is required when rebuild_assets is true" >&2
              exit 1
            fi
            echo "tag=v${version}" >> "$GITHUB_OUTPUT"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ steps.prepare.outputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "version=${{ steps.prepare.outputs.version }}" >> "$GITHUB_OUTPUT"
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
        shell: bash

  prepare_dry_run:
    name: Prepare release (dry run)
    if: inputs.dry_run == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.meta.outputs.tag }}
      release_version: ${{ steps.meta.outputs.version }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - name: Check out dry-run ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: false

      - name: Export release coordinates
        id: meta
        run: |
          version="$(sed -n 's/^#define PLUG_VERSION_STR "\([^"]*\)"/\1/p' NeuralAmpModeler/config.h | head -n 1)"
          if [ -z "$version" ]; then
            echo "could not read PLUG_VERSION_STR for the dry run" >&2
            exit 1
          fi
          echo "tag=" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "publish=false" >> "$GITHUB_OUTPUT"
          echo "DRY_RUN publish=false version=${version}"
        shell: bash

  # GitHub Actions does not allow inputs in permissions, so the dry run and the
  # real release are two callers of .github/workflows/release-build.yml.
  # The step list, including the steps that are not tied to one OS, lives there once.
  build:
    name: Build (dry run)
    needs: prepare_dry_run
    if: inputs.dry_run == true
    permissions:
      contents: read
    uses: ./.github/workflows/release-build.yml
    with:
      dry_run: true
      publish: false
      release_tag: ${{ needs.prepare_dry_run.outputs.release_tag }}
      release_version: ${{ needs.prepare_dry_run.outputs.release_version }}
      rebuild_assets: false
    secrets: inherit

  release_build:
    name: Build
    needs: prepare_release
    if: inputs.dry_run != true
    permissions:
      contents: write
    uses: ./.github/workflows/release-build.yml
    with:
      dry_run: false
      publish: ${{ needs.prepare_release.outputs.publish == 'true' }}
      release_tag: ${{ needs.prepare_release.outputs.release_tag }}
      release_version: ${{ needs.prepare_release.outputs.release_version }}
      rebuild_assets: ${{ inputs.rebuild_assets }}
    secrets: inherit
