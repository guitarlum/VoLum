name: CI

# pull_request: runs when a PR to dev/main is opened/updated.
# push: dev is the integration gate, main is the release branch gate.
# release/**: rehearse the full matrix on release branches before promoting to main.
# workflow_dispatch windows_only: Windows tests + installer + zip, no macOS, Linux, pluginval, or smokes.
on:
  workflow_dispatch:
    inputs:
      windows_only:
        description: 'Windows tests + installer + zip only (skip macOS, Linux, coverage, NAMCore, pluginval, smokes)'
        type: boolean
        default: false
  push:
    branches:
      - dev
      - main
      - release/**
  pull_request:
    branches:
      - dev
      - main
      - release/**

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_NAME: NeuralAmpModeler

jobs:
  formatting:
    name: Formatting
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.windows_only != true }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test appcast note extraction
        run: .github/scripts/test-appcast-notes.sh

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format
        shell: bash

      - name: Check clang-format output
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
            # A dispatch or a new branch has no previous push: check everything since dev.
            if [[ -z "$BASE" || "$BASE" == "0000000000000000000000000000000000000000" ]]; then
              BASE="$(git merge-base origin/dev HEAD)"
              if [[ "$BASE" == "$(git rev-parse HEAD)" ]]; then
                BASE="HEAD^"
              fi
            fi
          fi
          mapfile -t files < <(git diff --name-only --diff-filter=ACMRT "$BASE" "${{ github.sha }}" -- '*.h' '*.cpp' \
            | grep -v '^NeuralAmpModeler/tests/third_party/' || true)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No changed C++ files to format-check."
            exit 0
          fi
          clang-format -i "${files[@]}"
          git diff --exit-code
        shell: bash

  namcore:
    name: NAMCore regression tests
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.windows_only != true }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Check out submodules
        run: bash NeuralAmpModeler/scripts/checkout-submodules.sh
        shell: bash

      - name: Build NAMCore tools
        working-directory: NeuralAmpModelerCore
        env:
          CXX: clang++
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          cmake --build build -j4

      - name: Run NAMCore tests and render smoke checks
        working-directory: NeuralAmpModelerCore
        run: |
          ./build/tools/run_tests
          ./build/tools/benchmodel ./example_models/wavenet.nam
          ./build/tools/benchmodel ./example_models/lstm.nam
          ./build/tools/render ./example_models/wavenet.nam ./example_audio/input.wav ./example_audio/output.wav

  windows:
    name: Windows (tests + installer + portable zip + plugin validation)
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Check out submodules
        run: bash NeuralAmpModeler/scripts/checkout-submodules.sh
        shell: bash

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Get VST3 SDK
        run: |
          cd iPlug2/Dependencies/IPlug
          ./download-vst3-sdk.sh master build-validator
          ./download-wam-sdk.sh
        shell: bash

      - name: Get Prebuilt Libs
        run: |
          cd iPlug2/Dependencies
          ./download-prebuilt-libs.sh
        shell: bash

      - name: Install Inno Setup
        run: choco install innosetup -y
        shell: pwsh

      - name: Setup Python3
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          architecture: "x64"

      - name: Apply iPlug2 patches
        run: ./NeuralAmpModeler/iplug2-patches/apply-iplug2-patches.ps1
        shell: pwsh

      - name: Unit tests (doctest)
        run: ./NeuralAmpModeler/scripts/run-tests-win.ps1
        shell: pwsh

      - name: Build Windows installer
        run: |
          cd NeuralAmpModeler\scripts
          .\makedist-win.bat full installer
        shell: cmd

      - name: Verify Windows installer layout
        run: ./NeuralAmpModeler/scripts/verify-installer-win.ps1 -RunSilentInstall
        shell: pwsh
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.windows_only != true }}

      - name: Verify Windows installer exists
        run: ./NeuralAmpModeler/scripts/verify-installer-win.ps1
        shell: pwsh
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.windows_only }}

      - name: Build Windows portable zip
        run: |
          cd NeuralAmpModeler\scripts
          .\makedist-win.bat full zip
        shell: cmd

      - name: Verify portable package layout
        run: ./NeuralAmpModeler/scripts/verify-packaging-win.ps1
        shell: pwsh

      # The editor is NanoVG on OpenGL 2. The hosted runner only has the GDI
      # OpenGL 1.1 driver, so pluginval's Editor test crashes without Mesa.
      - name: Install Mesa software OpenGL (the editor needs OpenGL 2.0)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.windows_only != true }}
        uses: ssciwr/setup-mesa-dist-win@2dfeaebfa514f74c2b8cd8d27108c31486d33e72 # v3.0.0

      - name: Validate Windows VST3 with pluginval
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.windows_only != true }}
        run: ./NeuralAmpModeler/scripts/validate-vst3-win.ps1
        shell: pwsh

      - name: Smoke Windows standalone audio config
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.windows_only != true }}
        run: ./NeuralAmpModeler/scripts/smoke-standalone-audio-config-win.ps1
        shell: pwsh

      - name: Smoke Windows upgrade install
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.windows_only != true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./NeuralAmpModeler/scripts/smoke-upgrade-install-win.ps1
        shell: pwsh

      - name: Upload Windows artifacts (VoLum-win)
        uses: actions/upload-artifact@v4
        with:
          name: VoLum-win
          path: |
            NeuralAmpModeler/build-win/out/
            NeuralAmpModeler/build-win/installer/VoLum-Setup.exe
          if-no-files-found: error

  windows-installer-upgrade:
    name: Windows installer upgrade
    # No windows_only filter: it runs whenever the Windows job produced VoLum-win.
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download Windows artifacts (VoLum-win)
        uses: actions/download-artifact@v4
        with:
          name: VoLum-win
          path: ${{ runner.temp }}/VoLum-win

      - name: Install Mesa software OpenGL (the standalone needs OpenGL 2.0)
        uses: ssciwr/setup-mesa-dist-win@2dfeaebfa514f74c2b8cd8d27108c31486d33e72 # v3.0.0

      - name: Install a virtual audio device (VB-Cable)
        uses: LABSN/sound-ci-helpers@d08c889a7bba7d9b1b059f8f76dac4672ea3a9cf # v1

      - name: Upgrade v1.2.3 and v1.2.2 to this run's installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./NeuralAmpModeler/scripts/installer-upgrade-win.ps1 -ArtifactDir "${{ runner.temp }}/VoLum-win"
        shell: pwsh

  macos:
    name: macOS (tests + full distribution + plugin validation)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.windows_only != true }}
    # macos-latest is macOS 26, whose paravirtual GPU aborts pluginval inside
    # AppleParavirtCommandBuffer while the editor is open. macOS 15 runs the
    # same editor tests. Do not move these jobs back to macos-latest.
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Check out submodules
        run: bash NeuralAmpModeler/scripts/checkout-submodules.sh
        shell: bash

      - name: Get VST3 SDK
        run: |
          cd iPlug2/Dependencies/IPlug
          ./download-vst3-sdk.sh master build-validator
          ./download-wam-sdk.sh

      - name: Get Prebuilt Libs
        run: |
          cd iPlug2/Dependencies
          ./download-prebuilt-libs.sh

      - name: Unit tests (doctest)
        run: bash NeuralAmpModeler/scripts/run-tests-mac.sh

      - name: Sanitized unit tests (ASan/UBSan)
        run: bash NeuralAmpModeler/scripts/run-tests-mac.sh --sanitize

      - name: Build macOS distribution (installer + standalone + VST3 zip)
        env:
          PACKAGE_DSYMS: "0"
          XCODEBUILD_JOBS: "2"
        run: |
          set -o pipefail
          cd NeuralAmpModeler/scripts
          ./makedist-mac.sh full all 2>&1 | tee ../../mac-package.log

      - name: Show macOS build failure diagnostics
        if: failure()
        run: |
          echo "macOS packaging failed. Recent build logs:"
          emit_annotation() {
            local file="$1"
            if [[ -f "$file" ]]; then
              python3 - "$file" > macos-build-diagnostic.txt <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          lines = path.read_text(errors="replace").splitlines()
          pattern = re.compile(
              r"(error:|fatal error:|BUILD FAILED|The following build commands failed|"
              r"failed with|Command .* failed|clang: error|ld: error)",
              re.IGNORECASE,
          )

          def trimmed(line):
              return line[:500] + (" ..." if len(line) > 500 else "")

          matches = [(idx + 1, line) for idx, line in enumerate(lines) if pattern.search(line)]
          print(f"---- {path} tail ----")
          for offset, line in enumerate(lines[-20:], start=max(1, len(lines) - 19)):
              print(f"{offset}: {trimmed(line)}")

          print("")
          print(f"---- {path} matches ----")
          if matches:
              for number, line in matches[-40:]:
                  print(f"{number}: {trimmed(line)}")
          else:
              print("No explicit error lines matched.")
          PY
              message="$(python3 -c 'from pathlib import Path; text = Path("macos-build-diagnostic.txt").read_text(errors="replace"); text = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A"); print(text[-7000:])')"
              echo "::error title=macOS build log::$message"
            fi
          }
          if [[ -f NeuralAmpModeler/build-mac.log ]]; then
            tail -n 200 NeuralAmpModeler/build-mac.log
            emit_annotation NeuralAmpModeler/build-mac.log
          fi
          if [[ -f mac-package.log ]]; then
            tail -n 240 mac-package.log
            emit_annotation mac-package.log
          fi
          if [[ -f NeuralAmpModeler/build-mac/build-mac.log ]]; then
            tail -n 200 NeuralAmpModeler/build-mac/build-mac.log
            emit_annotation NeuralAmpModeler/build-mac/build-mac.log
          fi
          if [[ -d NeuralAmpModeler/build-mac ]]; then
            find NeuralAmpModeler/build-mac -maxdepth 3 -type f | sort | tail -n 100
          fi

      - name: Show macOS build failure diagnostics
        if: failure()
        run: |
          echo "macOS packaging failed. Recent build logs:"
          if [[ -f NeuralAmpModeler/build-mac.log ]]; then
            tail -n 200 NeuralAmpModeler/build-mac.log
          fi
          if [[ -f NeuralAmpModeler/build-mac/build-mac.log ]]; then
            tail -n 200 NeuralAmpModeler/build-mac/build-mac.log
          fi
          if [[ -d NeuralAmpModeler/build-mac ]]; then
            find NeuralAmpModeler/build-mac -maxdepth 3 -type f | sort | tail -n 100
          fi

      - name: Verify macOS binary architectures
        run: |
          APP_BIN="$HOME/Applications/VoLum.app/Contents/MacOS/VoLum"
          VST3_BIN="$HOME/Library/Audio/Plug-Ins/VST3/VoLum.vst3/Contents/MacOS/VoLum"
          AU_BIN="$HOME/Library/Audio/Plug-Ins/Components/VoLum.component/Contents/MacOS/VoLum"
          app_archs=$(lipo -archs "$APP_BIN")
          vst3_archs=$(lipo -archs "$VST3_BIN")
          au_archs=$(lipo -archs "$AU_BIN")
          echo "APP architectures: $app_archs"
          echo "VST3 architectures: $vst3_archs"
          echo "AU architectures: $au_archs"
          [[ "$app_archs" == *arm64* && "$app_archs" == *x86_64* ]]
          [[ "$vst3_archs" == *arm64* && "$vst3_archs" == *x86_64* ]]
          [[ "$au_archs" == *arm64* && "$au_archs" == *x86_64* ]]

      - name: Validate macOS AU with auval
        timeout-minutes: 15
        run: bash NeuralAmpModeler/scripts/validate-au-mac.sh

      - name: Validate macOS VST3 with pluginval
        run: bash NeuralAmpModeler/scripts/validate-vst3-mac.sh

      - name: Verify DMG, VST3 zip, and installer PKG layout
        env:
          VERIFY_MAC_REQUIRE_INSTALLER: "1"
        run: |
          chmod +x NeuralAmpModeler/scripts/verify-packaging-mac.sh
          NeuralAmpModeler/scripts/verify-packaging-mac.sh auto

      - name: Smoke macOS upgrade install
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x NeuralAmpModeler/scripts/smoke-upgrade-install-mac.sh
          bash NeuralAmpModeler/scripts/smoke-upgrade-install-mac.sh
        shell: bash

      - name: Install macOS PKG via installer CLI
        if: env.VOLUM_UPGRADE_SMOKE_SKIPPED == '1'
        run: bash NeuralAmpModeler/scripts/smoke-installer-mac.sh
        shell: bash

      # Before the standalone smokes: they leave VoLum's microphone prompt
      # unanswered, and while it is up macOS holds REAPER's request as well.
      - name: macOS REAPER and standalone crash smoke
        timeout-minutes: 30
        env:
          REAPER_DMG_URL: https://dlcf.reaper.fm/7.x/reaper769_universal.dmg
          REAPER_DMG_SHA256: c9a042bc4c58be8e3af8bb5c0fe0c44cf387caf3f51ccb439c04f2fa4b14549a
        run: |
          set -euo pipefail
          dmg="$RUNNER_TEMP/reaper.dmg"
          mnt="$RUNNER_TEMP/reaper-dmg"
          curl -fsSL --retry 3 -o "$dmg" "$REAPER_DMG_URL"
          echo "$REAPER_DMG_SHA256  $dmg" | shasum -a 256 -c -
          # The image shows REAPER's license on attach and waits for a yes.
          { yes || true; } | hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg" > /dev/null
          rm -rf "$RUNNER_TEMP/REAPER.app"
          cp -R "$mnt/REAPER.app" "$RUNNER_TEMP/REAPER.app"
          hdiutil detach "$mnt" > /dev/null
          # REAPER opens the default input on launch and waits on the microphone
          # prompt, which nobody answers on a runner.
          sqlite3 "$HOME/Library/Application Support/com.apple.TCC/TCC.db" \
            "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version, flags) VALUES ('kTCCServiceMicrophone', 'com.cockos.reaper', 0, 2, 3, 1, 0);"
          bash NeuralAmpModeler/scripts/smoke-reaper-mac.sh --format all --runs 3 \
            --reaper "$RUNNER_TEMP/REAPER.app" --app "${VOLUM_INSTALLED_APP:-/Applications/VoLum.app}" \
            --out "$RUNNER_TEMP/reaper-smoke"
        shell: bash

      - name: Upload macOS REAPER smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VoLum-mac-reaper-smoke
          path: |
            ${{ runner.temp }}/reaper-smoke/*.png
            ${{ runner.temp }}/reaper-smoke/*.ips
            ${{ runner.temp }}/reaper-smoke/*/result.txt
            ${{ runner.temp }}/reaper-smoke/*/*.log
          if-no-files-found: ignore

      - name: macOS standalone launch smoke
        run: bash NeuralAmpModeler/scripts/smoke-standalone-launch-mac.sh "${VOLUM_INSTALLED_APP:-/Applications/VoLum.app}"
        shell: bash

      - name: macOS standalone audio config smoke
        run: |
          chmod +x NeuralAmpModeler/scripts/smoke-standalone-audio-config-mac.sh
          bash NeuralAmpModeler/scripts/smoke-standalone-audio-config-mac.sh "${VOLUM_INSTALLED_APP:-/Applications/VoLum.app}"
        shell: bash

      - name: Upload macOS launch smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VoLum-mac-launch-smoke
          path: |
            /tmp/volum-mac-launch.png
            /tmp/volum-mac-launch.log
          if-no-files-found: warn

      - name: Upload macOS artifacts (VoLum-mac)
        uses: actions/upload-artifact@v4
        with:
          name: VoLum-mac
          path: NeuralAmpModeler/build-mac/out/
          if-no-files-found: error

  macos-installer-upgrade:
    name: macOS installer upgrade
    # No windows_only filter: it runs whenever the macOS job produced VoLum-mac.
    # macos-15: same virtual-GPU reason as the macOS job above.
    needs: macos
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download macOS artifacts (VoLum-mac)
        uses: actions/download-artifact@v4
        with:
          name: VoLum-mac
          path: ${{ runner.temp }}/VoLum-mac

      - name: Upgrade v1.2.3 and v1.2.2 to this run's installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash NeuralAmpModeler/scripts/installer-upgrade-mac.sh --artifact-dir "${{ runner.temp }}/VoLum-mac"
        shell: bash

      - name: Upload macOS installer upgrade diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VoLum-mac-installer-upgrade
          path: ${{ runner.temp }}/volum-installer-upgrade-mac/diagnostics/
          if-no-files-found: warn

  macos-standalone-e2e:
    name: macOS standalone e2e
    # No windows_only filter: it runs whenever the macOS job produced VoLum-mac.
    # macos-15: same virtual-GPU reason as the macOS job above.
    needs: macos
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download macOS artifacts (VoLum-mac)
        uses: actions/download-artifact@v4
        with:
          name: VoLum-mac
          path: ${{ runner.temp }}/VoLum-mac

      - name: Setup Python3
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the e2e helpers (python-rtmidi, Quartz, Pillow)
        run: python -m pip install python-rtmidi pyobjc-framework-Quartz pillow
        shell: bash

      - name: Fresh, upgrade, MIDI and screenshot scenarios
        run: bash NeuralAmpModeler/scripts/e2e-standalone-mac.sh --artifact-dir "${{ runner.temp }}/VoLum-mac"
        shell: bash

      - name: Upload macOS standalone e2e screenshots (mac-e2e-shots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-e2e-shots
          path: ${{ runner.temp }}/volum-e2e-standalone-mac/shots/
          if-no-files-found: warn

      - name: Upload macOS standalone e2e diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VoLum-mac-standalone-e2e
          path: ${{ runner.temp }}/volum-e2e-standalone-mac/diagnostics/
          if-no-files-found: warn

  linux-tests:
    name: Linux tests
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.windows_only != true }}
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Check out submodules
        run: bash NeuralAmpModeler/scripts/checkout-submodules.sh
        shell: bash

      - name: Get VST3 SDK
        run: |
          cd iPlug2/Dependencies/IPlug
          ./download-vst3-sdk.sh master
        shell: bash

      - name: Provision Linux CI packages
        run: bash NeuralAmpModeler/scripts/linux/provision-linux.sh --ci
        shell: bash

      - name: Unit tests (doctest, GCC)
        env:
          VOLUM_REQUIRE_LINUX_HASH_REFERENCE: "1"
          VOLUM_REQUIRE_X: "1"
        run: bash NeuralAmpModeler/scripts/run-tests-linux.sh
        shell: bash

      - name: Sanitized unit tests (Clang ASan/UBSan)
        run: bash NeuralAmpModeler/scripts/run-tests-linux.sh --clang --sanitize
        shell: bash

  linux-plugin:
    name: Linux plugin gates
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.windows_only != true }}
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Check out submodules
        run: bash NeuralAmpModeler/scripts/checkout-submodules.sh
        shell: bash

      - name: Provision Linux CI packages and host tools
        run: bash NeuralAmpModeler/scripts/linux/provision-linux.sh --ci --hosts
        shell: bash

      - name: Build the VST3 and the Steinberg validator
        run: bash NeuralAmpModeler/scripts/build-linux.sh Release
        shell: bash

      - name: Validator, pluginval, UI-thread sites and Carla
        run: |
          export PATH="$HOME/volum-linux/tools/bin:$PATH"
          export VOLUM_LINUX_ROOT="$HOME/volum-linux"
          bash NeuralAmpModeler/scripts/validate-vst3-linux.sh --no-build
        shell: bash

      - name: REAPER render null and two instances
        run: |
          export PATH="$HOME/volum-linux/tools/bin:$PATH"
          export VOLUM_LINUX_ROOT="$HOME/volum-linux"
          bash NeuralAmpModeler/scripts/smoke-reaper-linux.sh
        shell: bash

      - name: Upload Linux VST3 (VoLum-linux-vst3)
        uses: actions/upload-artifact@v4
        with:
          name: VoLum-linux-vst3
          path: build-linux/VoLum.vst3

      - name: Upload Linux plugin gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VoLum-linux-plugin-logs
          path: build-linux/plugin-gates/
          if-no-files-found: warn

  linux-app:
    name: Linux standalone
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.windows_only != true }}
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Check out submodules
        run: bash NeuralAmpModeler/scripts/checkout-submodules.sh
        shell: bash

      - name: Get VST3 SDK
        run: |
          cd iPlug2/Dependencies/IPlug
          ./download-vst3-sdk.sh master
        shell: bash

      - name: Provision Linux CI packages
        run: |
          bash NeuralAmpModeler/scripts/linux/provision-linux.sh --ci
          sudo apt-get install -y --no-install-recommends bubblewrap
        shell: bash

      - name: Build the standalone (g++-12)
        run: |
          cmake -S NeuralAmpModeler/projects/linux -B build-linux -DCMAKE_BUILD_TYPE=Release -DVOLUM_BUILD_VALIDATOR=OFF
          cmake --build build-linux -j "$(nproc)" --target VoLum-app
        env:
          CC: gcc-12
          CXX: g++-12
        shell: bash

      - name: No hard JACK, PulseAudio, libstdc++ or libcurl dependency
        run: |
          readelf -d build-linux/standalone/VoLum | tee needed.txt | grep NEEDED
          if grep -E 'NEEDED.*\[(libjack|libpulse|libstdc\+\+|libcurl)' needed.txt; then
            echo "::error::the standalone links a library that must be loaded at runtime"
            exit 1
          fi
        shell: bash

      - name: Standalone audio smoke (Xvfb, jackd dummy)
        run: bash NeuralAmpModeler/scripts/smoke-standalone-audio-linux.sh --app build-linux/standalone/VoLum --out "$RUNNER_TEMP/volum-smoke-app" --require-hide --require-rt
        shell: bash

      - name: Build the sanitized standalone (ASan + UBSan, g++-12)
        run: |
          cmake -S NeuralAmpModeler/projects/linux -B build-linux-asan -DCMAKE_BUILD_TYPE=RelWithDebInfo -DVOLUM_SANITIZE=ON -DVOLUM_BUILD_VALIDATOR=OFF
          cmake --build build-linux-asan -j "$(nproc)" --target VoLum-app
        env:
          CC: gcc-12
          CXX: g++-12
        shell: bash

      - name: Sanitized standalone smoke (1024-frame JACK cycle)
        run: |
          echo 'shift-base:stb_image.h' > "$RUNNER_TEMP/ubsan.supp"
          export ASAN_OPTIONS=detect_leaks=0
          export UBSAN_OPTIONS="print_stacktrace=1:suppressions=$RUNNER_TEMP/ubsan.supp"
          bash NeuralAmpModeler/scripts/smoke-standalone-audio-linux.sh --app build-linux-asan/standalone/VoLum --out "$RUNNER_TEMP/volum-smoke-app-asan" --sanitized --period 1024 --seconds 20 --require-hide
        shell: bash

      - name: Upload smoke output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-standalone-smoke
          path: |
            ${{ runner.temp }}/volum-smoke-app
            ${{ runner.temp }}/volum-smoke-app-asan
          if-no-files-found: warn

  coverage:
    name: Coverage report (VoLum + AudioDSPTools, non-blocking)
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.windows_only != true }}
    continue-on-error: true
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Check out submodules
        run: bash NeuralAmpModeler/scripts/checkout-submodules.sh
        shell: bash

      - name: Get VST3 SDK
        run: |
          cd iPlug2/Dependencies/IPlug
          ./download-vst3-sdk.sh master

      - name: Measure doctest coverage (Clang source-based)
        run: bash NeuralAmpModeler/scripts/run-coverage-mac.sh

      - name: Upload coverage HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VoLum-coverage
          path: NeuralAmpModeler/build-tests-mac/coverage-html/
          if-no-files-found: warn
