<svg width="500" height="500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Metronome body (trapezoid) -->
  <path d="M160,440 L200,80 L300,80 L340,440 Z" fill="none" stroke="white" stroke-width="30" stroke-linejoin="round"/>
  <!-- Pendulum arm (tilted) -->
  <line x1="250" y1="360" x2="310" y2="90" stroke="white" stroke-width="22" stroke-linecap="round"/>
  <!-- Pendulum weight -->
  <circle cx="290" cy="170" r="24" fill="white"/>
  <!-- Base line -->
  <line x1="140" y1="440" x2="360" y2="440" stroke="white" stroke-width="30" stroke-linecap="round"/>
</svg>
